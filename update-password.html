<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Set New Password - Little Blossoms</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:Inter,Arial,sans-serif;

    background:
        radial-gradient(
            circle at top left,
            #dbeafe,
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            #fce7f3,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #f8fafc,
            #eef2ff
        );
}

.box{

    width:100%;
    max-width:430px;

    background:rgba(255,255,255,.95);

    border-radius:28px;

    padding:38px 30px;

    box-shadow:
        0 25px 70px
        rgba(15,23,42,.15);

    text-align:center;
}

.logo{

    width:70px;
    height:70px;

    margin:0 auto 18px;

    border-radius:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:25px;
    font-weight:900;

    color:white;

    background:
        linear-gradient(
            135deg,
            #6366f1,
            #8b5cf6
        );

    box-shadow:
        0 12px 30px
        rgba(99,102,241,.35);
}

h1{

    font-size:28px;

    color:#111827;

    margin-bottom:8px;
}

.subtitle{

    font-size:14px;

    color:#64748b;

    margin-bottom:28px;
}

.form-group{

    text-align:left;

    margin-bottom:18px;
}

label{

    display:block;

    font-size:13px;

    font-weight:700;

    color:#334155;

    margin-bottom:8px;
}

.input-wrap{

    position:relative;
}

input{

    width:100%;

    padding:14px 48px 14px 15px;

    border:1px solid #dbe2ea;

    border-radius:14px;

    outline:none;

    font-size:15px;

    background:#f8fafc;

    transition:.2s;
}

input:focus{

    border-color:#6366f1;

    background:#fff;

    box-shadow:
        0 0 0 4px
        rgba(99,102,241,.10);
}

.toggle{

    position:absolute;

    right:12px;
    top:50%;

    transform:translateY(-50%);

    border:0;

    background:none;

    color:#64748b;

    cursor:pointer;

    font-size:13px;

    padding:5px;
}

button.save{

    width:100%;

    border:0;

    border-radius:14px;

    padding:14px;

    font-size:15px;

    font-weight:800;

    color:white;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #4f46e5,
            #7c3aed
        );

    box-shadow:
        0 10px 25px
        rgba(79,70,229,.25);

    transition:.2s;
}

button.save:hover{

    transform:translateY(-1px);
}

button.save:disabled{

    opacity:.65;

    cursor:not-allowed;

    transform:none;
}

.message{

    margin-top:18px;

    padding:12px;

    border-radius:12px;

    font-size:13px;

    display:none;
}

.success{

    display:block;

    background:#ecfdf5;

    color:#047857;
}

.error{

    display:block;

    background:#fef2f2;

    color:#b91c1c;
}

.back{

    display:block;

    margin-top:20px;

    color:#4f46e5;

    text-decoration:none;

    font-size:13px;

    font-weight:700;
}

.footer{

    margin-top:28px;

    font-size:12px;

    color:#94a3b8;
}

.loading{

    padding:15px;

    border-radius:12px;

    background:#f8fafc;

    color:#64748b;

    font-size:13px;

    margin-bottom:18px;
}

.hidden{

    display:none !important;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        LB
    </div>

    <h1>
        Create New Password
    </h1>

    <div class="subtitle">
        Enter a new password for your Little Blossoms account.
    </div>


    <div id="loadingBox" class="loading">
        Verifying password reset link...
    </div>


    <form
        id="passwordForm"
        class="hidden"
    >

        <div class="form-group">

            <label for="password">
                New Password
            </label>

            <div class="input-wrap">

                <input
                    type="password"
                    id="password"
                    placeholder="Enter new password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    onclick="togglePassword('password',this)"
                >
                    Show
                </button>

            </div>

        </div>


        <div class="form-group">

            <label for="confirmPassword">
                Confirm Password
            </label>

            <div class="input-wrap">

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm new password"
                    minlength="6"
                    required
                >

                <button
                    type="button"
                    class="toggle"
                    onclick="togglePassword('confirmPassword',this)"
                >
                    Show
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="save"
            id="saveBtn"
        >
            Update Password
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="login.html"
        class="back"
    >
        ← Back to Login
    </a>


    <div class="footer">
        Little Blossoms Preschool & Day Care
    </div>

</div>


<script>


const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const loadingBox =
document.getElementById("loadingBox");

const passwordForm =
document.getElementById("passwordForm");

const message =
document.getElementById("message");

const saveBtn =
document.getElementById("saveBtn");


function showMessage(text,type){

    message.textContent =
        text;

    message.className =
        "message " + type;

}


function togglePassword(id,button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        button.textContent =
            "Hide";

    }else{

        input.type = "password";

        button.textContent =
            "Show";
    }

}


/*
   Supabase password recovery.

   When user opens the email link,
   Supabase creates a recovery session.

   We wait for PASSWORD_RECOVERY
   or check the current session.
*/


let recoveryReady = false;


function showPasswordForm(){

    if(recoveryReady)
        return;

    recoveryReady = true;

    loadingBox.classList.add(
        "hidden"
    );

    passwordForm.classList.remove(
        "hidden"
    );
}


/* Listen for Supabase recovery event */

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        console.log(
            "Auth event:",
            event
        );

        if(
            event ===
            "PASSWORD_RECOVERY"
        ){

            showPasswordForm();

        }

    }
);


/* Check current session */

(async function(){

    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth.getSession();


        if(error){

            console.error(error);

        }


        if(data && data.session){

            /*
              A session exists.
              Allow password update.
            */

            showPasswordForm();

        }else{

            /*
              Give the recovery event
              a little time to arrive.
            */

            setTimeout(() => {

                if(!recoveryReady){

                    loadingBox.textContent =
                        "This password reset link is invalid or expired. Please request a new reset link.";

                    showMessage(
                        "Please request a new password reset link.",
                        "error"
                    );

                }

            },3000);

        }

    }catch(error){

        console.error(error);

        loadingBox.textContent =
            "Unable to verify reset link.";

        showMessage(
            "Unable to verify the reset link.",
            "error"
        );

    }

})();


/* Update password */

passwordForm.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const password =
            document.getElementById(
                "password"
            ).value;

        const confirmPassword =
            document.getElementById(
                "confirmPassword"
            ).value;


        if(password.length < 6){

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;
        }


        if(password !== confirmPassword){

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;
        }


        saveBtn.disabled = true;

        saveBtn.textContent =
            "Updating...";


        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth.updateUser({
                password: password
            });


            if(error){

                throw error;

            }


            showMessage(
                "Password updated successfully! Redirecting to login...",
                "success"
            );


            saveBtn.textContent =
                "Password Updated";


            /*
              Give Supabase a moment,
              then go to login.
            */

            setTimeout(
                async () => {

                    await supabaseClient.auth.signOut();

                    window.location.href =
                        "login.html";

                },
                1800
            );


        }catch(error){

            console.error(error);

            showMessage(
                error.message ||
                "Unable to update password.",
                "error"
            );

            saveBtn.disabled =
                false;

            saveBtn.textContent =
                "Update Password";

        }

    }
);

</script>

</body>
</html>
