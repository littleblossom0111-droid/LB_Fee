<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0">

<title>Set New Password - Little Blossoms</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    font-family:Arial,Helvetica,sans-serif;

    background:
        linear-gradient(
            135deg,
            #eef7ff,
            #fff0f7
        );
}

.box{
    width:100%;
    max-width:430px;

    padding:35px 28px;

    background:rgba(255,255,255,.96);

    border-radius:28px;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.15);

    text-align:center;
}

.logo{
    width:70px;
    height:70px;

    margin:0 auto 18px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    color:white;

    font-size:27px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff4ca0,
            #ad69e9,
            #42bdf3
        );

    box-shadow:
        0 10px 30px
        rgba(200,70,180,.3);
}

h1{
    font-size:27px;
    color:#222;

    margin-bottom:8px;
}

.subtitle{
    color:#777;
    font-size:14px;

    margin-bottom:25px;
}

.form-group{
    text-align:left;
    margin-bottom:18px;
}

label{
    display:block;

    margin-bottom:8px;

    color:#333;

    font-size:14px;
    font-weight:bold;
}

.input-wrap{
    position:relative;
}

input{
    width:100%;

    min-height:49px;

    padding:
        13px 50px 13px 15px;

    border:
        1px solid #ddd;

    border-radius:13px;

    outline:none;

    background:#fafafa;

    font-size:15px;
}

input:focus{
    border-color:#ff70a8;

    box-shadow:
        0 0 0 4px
        rgba(255,100,160,.12);
}

.show-btn{
    position:absolute;

    right:10px;
    top:50%;

    transform:translateY(-50%);

    border:0;

    background:transparent;

    color:#e84f91;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;
}

.save-btn{
    width:100%;

    min-height:49px;

    margin-top:5px;

    border:0;

    border-radius:13px;

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff4297,
            #ff7864,
            #ff9b4e
        );

    font-size:16px;
    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 10px 25px
        rgba(255,80,130,.25);
}

.save-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.message{
    min-height:20px;

    margin-top:16px;

    padding:10px;

    border-radius:10px;

    font-size:13px;

    line-height:1.4;
}

.loading{
    color:#666;

    font-size:14px;

    padding:15px;
}

.back{
    display:block;

    margin-top:20px;

    color:#e84f91;

    text-decoration:none;

    font-size:13px;

    font-weight:bold;
}

.hidden{
    display:none !important;
}

.footer{
    margin-top:25px;

    color:#999;

    font-size:11px;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        LB
    </div>

    <h1>
        Create New Password
    </h1>

    <div class="subtitle">
        Set a new password for your Little Blossoms account.
    </div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        Verifying reset link...
    </div>


    <!-- PASSWORD FORM -->

    <form
        id="passwordForm"
        class="hidden"
    >

        <div class="form-group">

            <label>
                New Password
            </label>

            <div class="input-wrap">

                <input
                    type="password"
                    id="password"
                    minlength="6"
                    placeholder="Enter new password"
                    required
                >

                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword('password',this)"
                >
                    Show
                </button>

            </div>

        </div>


        <div class="form-group">

            <label>
                Confirm Password
            </label>

            <div class="input-wrap">

                <input
                    type="password"
                    id="confirmPassword"
                    minlength="6"
                    placeholder="Confirm new password"
                    required
                >

                <button
                    type="button"
                    class="show-btn"
                    onclick="togglePassword('confirmPassword',this)"
                >
                    Show
                </button>

            </div>

        </div>


        <button
            type="submit"
            class="save-btn"
            id="saveBtn"
        >
            Update Password
        </button>

    </form>


    <div
        id="message"
        class="message"
    ></div>


    <a
        href="login.html"
        class="back"
    >
        ← Back to Login
    </a>


    <div class="footer">
        Little Blossoms Preschool & Day Care
    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================
   ELEMENTS
========================================= */

const loading =
document.getElementById("loading");

const form =
document.getElementById("passwordForm");

const message =
document.getElementById("message");

const saveBtn =
document.getElementById("saveBtn");


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type){

    message.textContent = text;

    message.style.color =
        type === "success"
        ? "#047857"
        : "#b91c1c";

    message.style.background =
        type === "success"
        ? "#ecfdf5"
        : "#fef2f2";

}


/* =========================================
   SHOW / HIDE PASSWORD
========================================= */

function togglePassword(id,button){

    const input =
        document.getElementById(id);

    if(input.type === "password"){

        input.type = "text";

        button.textContent = "Hide";

    }else{

        input.type = "password";

        button.textContent = "Show";

    }

}


/* =========================================
   SHOW FORM
========================================= */

function showForm(){

    loading.classList.add("hidden");

    form.classList.remove("hidden");

}


/* =========================================
   AUTH RECOVERY
========================================= */

supabaseClient.auth.onAuthStateChange(
    async function(event,session){

        console.log(
            "Supabase Auth:",
            event
        );

        if(
            event === "PASSWORD_RECOVERY"
        ){

            showForm();

        }

    }
);


/* =========================================
   CHECK SESSION
========================================= */

async function checkRecovery(){

    try{

        /*
          Supabase recovery link
          may contain the session
          in the URL.
        */

        const hash =
            window.location.hash;


        if(hash){

            console.log(
                "Recovery hash detected"
            );

        }


        const {
            data,
            error
        } =
        await supabaseClient
        .auth
        .getSession();


        if(error){

            console.error(error);

        }


        /*
          If recovery session already exists
        */

        if(
            data &&
            data.session
        ){

            showForm();

            return;

        }


        /*
          Wait for PASSWORD_RECOVERY
          event.
        */

        setTimeout(
            function(){

                if(
                    form.classList.contains(
                        "hidden"
                    )
                ){

                    loading.textContent =
                        "This password reset link is invalid or expired.";

                    showMessage(
                        "Please request a new password reset link.",
                        "error"
                    );

                }

            },
            5000
        );


    }catch(error){

        console.error(error);

        loading.textContent =
            "Unable to verify reset link.";

        showMessage(
            "Please request a new password reset link.",
            "error"
        );

    }

}


checkRecovery();


/* =========================================
   UPDATE PASSWORD
========================================= */

form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const password =
            document
            .getElementById("password")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        if(password.length < 6){

            showMessage(
                "Password must be at least 6 characters.",
                "error"
            );

            return;

        }


        if(
            password !==
            confirmPassword
        ){

            showMessage(
                "Passwords do not match.",
                "error"
            );

            return;

        }


        saveBtn.disabled = true;

        saveBtn.textContent =
            "Updating...";


        try{

            const {
                error
            } =
            await supabaseClient
            .auth
            .updateUser({

                password:password

            });


            if(error){

                throw error;

            }


            showMessage(
                "Password updated successfully.",
                "success"
            );


            saveBtn.textContent =
                "Password Updated";


            /*
              Sign out after changing password,
              then return to login.
            */

            setTimeout(
                async function(){

                    await supabaseClient
                        .auth
                        .signOut();

                    window.location.href =
                        "login.html";

                },
                1800
            );


        }catch(error){

            console.error(error);

            showMessage(
                error.message ||
                "Unable to update password.",
                "error"
            );

            saveBtn.disabled =
                false;

            saveBtn.textContent =
                "Update Password";

        }

    }
);

</script>

</body>
</html>
