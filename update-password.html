<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Blossoms - New Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        linear-gradient(
            135deg,
            #fff4f8,
            #eef7ff
        );
}

.box{
    width:92%;
    max-width:400px;

    background:white;

    padding:35px 28px;

    border-radius:24px;

    box-shadow:
        0 15px 50px
        rgba(0,0,0,.12);
}

.logo{
    width:75px;
    height:75px;

    margin:0 auto 15px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #ff7eb3,
            #65c7f7
        );

    color:white;

    font-size:30px;
    font-weight:bold;
}

h1{
    text-align:center;

    color:#333;

    font-size:25px;
}

.subtitle{
    text-align:center;

    color:#888;

    margin:8px 0 25px;

    line-height:1.5;
}

label{
    display:block;

    margin:15px 0 7px;

    color:#444;

    font-weight:600;
}

input{
    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:12px;

    outline:none;

    font-size:15px;
}

input:focus{
    border-color:#ff72a7;

    box-shadow:
        0 0 0 3px
        rgba(255,114,167,.12);
}

button{
    width:100%;

    margin-top:24px;

    padding:14px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #ff72a7,
            #ff9a62
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;
}

button:disabled{
    opacity:.6;

    cursor:not-allowed;
}

#message{
    margin-top:15px;

    text-align:center;

    font-size:14px;

    line-height:1.5;
}

.login-link{
    display:block;

    margin-top:18px;

    text-align:center;

    color:#e85d93;

    font-weight:600;

    font-size:14px;

    text-decoration:none;
}

.login-link:hover{
    text-decoration:underline;
}

.footer{
    text-align:center;

    margin-top:25px;

    color:#aaa;

    font-size:12px;
}

</style>

</head>

<body>

<div class="box">

    <div class="logo">
        LB
    </div>

    <h1>
        Create New Password
    </h1>

    <div class="subtitle">
        Enter your new password below.
    </div>


    <form id="passwordForm">

        <label>
            New Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter new password"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <label>
            Confirm Password
        </label>

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm new password"
            autocomplete="new-password"
            minlength="6"
            required
        >


        <button
            type="submit"
            id="updateBtn"
        >
            Update Password
        </button>

    </form>


    <div id="message"></div>


    <a
        href="login.html"
        class="login-link"
    >
        ← Back to Login
    </a>


    <div class="footer">
        Little Blossoms Preschool & Day Care
    </div>

</div>


<script>

const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form =
document.getElementById("passwordForm");

const button =
document.getElementById("updateBtn");

const message =
document.getElementById("message");


let recoverySessionReady = false;


/*
 * Supabase sends a PASSWORD_RECOVERY
 * event when the email reset link is opened.
 */

supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

        if(
            event === "PASSWORD_RECOVERY" &&
            session
        ){

            recoverySessionReady = true;

        }

    }
);


/*
 * Check whether the recovery session
 * already exists.
 */

async function checkSession(){

    const {
        data
    } =
        await supabaseClient.auth.getSession();


    if(data && data.session){

        recoverySessionReady = true;

    }

}


checkSession();


form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const password =
            document
            .getElementById("password")
            .value;

        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        message.textContent = "";


        if(password.length < 6){

            message.style.color =
                "#e53935";

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        if(password !== confirmPassword){

            message.style.color =
                "#e53935";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        button.disabled = true;

        button.textContent =
            "Updating...";


        try{

            const {
                error
            } =
                await supabaseClient.auth
                .updateUser({
                    password: password
                });


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled =
                    false;

                button.textContent =
                    "Update Password";

                return;
            }


            message.style.color =
                "#16a34a";

            message.textContent =
                "Password updated successfully.";


            button.textContent =
                "Password Updated";


            setTimeout(
                async () => {

                    await supabaseClient.auth
                        .signOut();

                    window.location.href =
                        "login.html";

                },
                1500
            );


        }catch(err){

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled =
                false;

            button.textContent =
                "Update Password";

        }

    }
);

</script>

</body>
</html>
