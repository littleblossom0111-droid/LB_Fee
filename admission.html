<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Blossoms | Admission</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f7f7fb;color:#18181b}.header{position:sticky;top:0;background:#fff;border-bottom:1px solid #eee;padding:14px 22px;display:flex;justify-content:space-between;align-items:center;z-index:3}.brand{display:flex;gap:10px;align-items:center;font-weight:800}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;display:grid;place-items:center;font-size:20px}.brand small{display:block;color:#888;font-size:10px;margin-top:3px}.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:700;cursor:pointer}.back{background:#f3f4f6}.logout{background:#fff1f2;color:#e11d48}.wrap{max-width:1050px;margin:auto;padding:24px 16px 50px}.card{background:#fff;border:1px solid #ececf2;border-radius:20px;padding:20px;margin-bottom:18px;box-shadow:0 12px 35px rgba(24,18,40,.07)}h1{font-size:28px;margin:0 0 5px}p{color:#777;font-size:12px}.title{font-size:16px;font-weight:800;margin-bottom:15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:700;margin-bottom:6px;color:#555}input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px;font-size:13px;outline:0}textarea{min-height:70px}.save{margin-top:17px;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;font-weight:800}.msg{text-align:center;margin-top:10px;font-size:12px;font-weight:700}.search{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:8px}.search button{background:#18181b;color:#fff}.result{display:flex;justify-content:space-between;align-items:center;border:1px solid #eee;border-radius:12px;padding:12px;margin-top:9px}.result small{display:block;color:#888;margin-top:4px;font-size:10px}.print{background:#eff6ff;color:#2563eb}.empty{text-align:center;color:#999;padding:18px;font-size:12px}@media(max-width:700px){.grid,.search{grid-template-columns:1fr}.full{grid-column:auto}}@media print{.header,.formcard,.searchcard{display:none!important}.printbox{display:block!important}.wrap{padding:0}.card{box-shadow:none;border:0}.printbox{font-family:Arial}}
.printbox{display:none}
</style></head><body><header class="header"><div class="brand"><div class="logo">🌸</div><div>Little Blossoms<small>Admission & Registration</small></div></div><div><button class="btn back" onclick="location.href='portal.html'">← Back</button> <button class="btn logout" onclick="logout()">Logout</button></div></header><main class="wrap">
<div class="card formcard"><h1>Admission Form</h1><p>Student admission, registration fee and monthly fee are saved together.</p><form id="form"><div class="grid">
<div><label>Student Name *</label><input id="name" required></div><div><label>Date of Birth *</label><input id="dob" type="date" required></div>
<div><label>Gender</label><select id="gender"><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></div><div><label>Admission Date *</label><input id="adate" type="date" required></div>
<div><label>Father Name *</label><input id="father" required></div><div><label>Mother Name</label><input id="mother"></div>
<div><label>Mobile *</label><input id="mobile" required></div><div><label>Alternate Mobile</label><input id="alt"></div>
<div class="full"><label>Address</label><textarea id="address"></textarea></div>
<div><label>Registration / Admission Fee (₹)</label><input id="regfee" type="number" min="0" value="0"></div><div><label>Monthly Fee (₹)</label><input id="monthly" type="number" min="0" value="0"></div>
<div><label>Registration Payment Method</label><select id="mode"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Other</option></select></div><div><label>Notes</label><input id="notes"></div>
</div><button class="save" id="save">Save Admission & Registration</button><div id="msg" class="msg"></div></form></div>
<div class="card searchcard"><div class="title">Search Admission Records</div><div class="search"><input id="sn" placeholder="Student Name"><input id="sd" type="date"><input id="sr" placeholder="Registration / Admission No."><input id="sid" placeholder="Student ID"><input id="sa" type="date"><input id="sx" placeholder="Father / Mother / Mobile / Address"><button class="btn" onclick="search()">Search</button></div><div id="results"><div class="empty">Search by any details. More details = more accurate matching.</div></div></div><div id="printbox" class="printbox"></div>
</main><script>
const db=supabase.createClient("https://holelzxzhaiefaqezmce.supabase.co","sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ"),$=x=>document.getElementById(x),today=()=>new Date().toISOString().slice(0,10);
$("adate").value=today();(async()=>{const{data}=await db.auth.getSession();if(!data.session)location.replace("login.html")})();
async function logout(){await db.auth.signOut();location.replace("login.html")}
$("form").onsubmit=async e=>{e.preventDefault();$("save").disabled=true;$("save").textContent="Saving...";$("msg").textContent="";
try{const{data:sd}=await db.auth.getSession(),uid=sd.session?.user?.id;if(!uid)throw Error("Session expired. Please login again.");
const{data:rn,error:re}=await db.rpc("lb_next_registration_no");if(re)throw re;const fee=Number($("regfee").value||0);
const obj={user_id:uid,student_name:$("name").value.trim(),name:$("name").value.trim(),father_name:$("father").value.trim(),gender:$("gender").value,alternate_mobile:$("alt").value.trim(),parent_name:$("father").value.trim(),mother_name:$("mother").value.trim(),mobile:$("mobile").value.trim(),joining_date:$("adate").value,admission_date:$("adate").value,date_of_birth:$("dob").value,registration_fee:fee,monthly_fee:Number($("monthly").value||0),status:"Active",notes:$("notes").value.trim(),address:$("address").value.trim(),registration_no:rn};
const{data:s,error:se}=await db.from("students").insert(obj).select().single();if(se)throw se;
if(fee>0){const{error:pe}=await db.from("registration_payments").insert({user_id:uid,student_id:s.id,amount:fee,payment_date:$("adate").value,payment_method:$("mode").value,notes:"Admission registration fee"});if(pe){await db.from("students").delete().eq("id",s.id);throw pe}}
$("msg").style.color="#15803d";$("msg").textContent="Admission saved. Registration No: "+rn;$("form").reset();$("adate").value=today();
}catch(x){$("msg").style.color="#dc2626";$("msg").textContent=x.message||"Unable to save admission."}$("save").disabled=false;$("save").textContent="Save Admission & Registration"};
async function search(){
const n=$("sn").value.trim(),d=$("sd").value,r=$("sr").value.trim(),sid=$("sid").value.trim(),a=$("sa").value,x=$("sx").value.trim();
if(!n&&!d&&!r&&!sid&&!a&&!x){$("results").innerHTML='<div class="empty">Enter at least one search detail.</div>';return}
let q=db.from("students").select("*").order("created_at",{ascending:false}).limit(100);
if(n){const safeN=n.replace(/,/g," ");q=q.or("student_name.ilike.%"+safeN+"%,name.ilike.%"+safeN+"%");}
if(d)q=q.eq("date_of_birth",d);
if(r)q=q.ilike("registration_no","%"+r+"%");
if(sid)q=q.eq("id",sid);
if(a)q=q.eq("admission_date",a);
if(x){
const safe=x.replace(/,/g," ");
q=q.or("father_name.ilike.%"+safe+"%,mother_name.ilike.%"+safe+"%,mobile.ilike.%"+safe+"%,alternate_mobile.ilike.%"+safe+"%,address.ilike.%"+safe+"%,parent_name.ilike.%"+safe+"%");
}
const{data,error}=await q;
if(error){console.error(error);$("results").innerHTML='<div class="empty">Unable to fetch records.</div>';return}
if(!data?.length){$("results").innerHTML='<div class="empty">No matching student/admission record found.</div>';return}
$("results").innerHTML=data.map(s=>'<div class="result"><div><b>'+esc(s.student_name||s.name||"—")+'</b><small>Student ID: '+esc(s.id||"—")+' • Reg: '+esc(s.registration_no||"—")+' • DOB: '+esc(s.date_of_birth||"—")+' • Admission: '+esc(s.admission_date||s.joining_date||"—")+'</small></div><button class="btn print" onclick=printRecord("'+s.id+'")>Print</button></div>').join("")
}

function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
async function printRecord(id){const{data:s}=await db.from("students").select("*").eq("id",id).single();if(!s){alert("Record not found.");return}const rows=[["Registration No.",s.registration_no],["Student Name",s.student_name],["Date of Birth",s.date_of_birth],["Gender",s.gender],["Father Name",s.father_name||s.parent_name],["Mother Name",s.mother_name],["Mobile",s.mobile],["Address",s.address],["Admission Date",s.admission_date||s.joining_date],["Registration Fee","₹ "+Number(s.registration_fee||0).toLocaleString("en-IN")],["Monthly Fee","₹ "+Number(s.monthly_fee||0).toLocaleString("en-IN")],["Status",s.status]];$("printbox").innerHTML='<h1 style="text-align:center">Little Blossoms Preschool & Day Care</h1><h2 style="text-align:center">Admission / Registration Record</h2><table style="width:100%;border-collapse:collapse">'+rows.map(r=>'<tr><td style="border:1px solid #ccc;padding:10px;font-weight:bold">'+esc(r[0])+'</td><td style="border:1px solid #ccc;padding:10px">'+esc(r[1]||"—")+'</td></tr>').join("")+'</table><p style="margin-top:50px">Parent/Guardian Signature: ____________________</p>';window.print()}
</script></body></html>
