<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify Email - Little Blossoms</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}
body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    color:white;
    background-image:
        linear-gradient(rgba(0,0,0,.16),rgba(0,0,0,.25)),
        url("daivik1.png");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
.box{
    width:100%;
    max-width:390px;
    padding:30px 23px;
    border-radius:25px;
    background:rgba(255,255,255,.16);
    border:1px solid rgba(255,255,255,.40);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:0 25px 70px rgba(0,0,0,.40);
    text-align:center;
}
.icon{font-size:42px;margin-bottom:8px}
h2{font-size:24px;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.sub{margin:8px 0 22px;font-size:13px;line-height:1.5;opacity:.9}
.email{font-weight:700;word-break:break-word}
input{
    width:100%;
    padding:15px;
    border-radius:13px;
    border:1px solid rgba(255,255,255,.40);
    outline:none;
    background:rgba(255,255,255,.18);
    color:white;
    text-align:center;
    font-size:24px;
    letter-spacing:8px;
}
input::placeholder{color:rgba(255,255,255,.65);letter-spacing:2px}
button{
    width:100%;
    margin-top:16px;
    padding:14px;
    border:0;
    border-radius:13px;
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    background:linear-gradient(135deg,#ec4899,#8b5cf6);
}
button:disabled{opacity:.6}
.secondary{
    margin-top:10px;
    background:rgba(255,255,255,.12);
    border:1px solid rgba(255,255,255,.35);
}
.message{
    min-height:20px;
    margin-top:14px;
    font-size:12px;
    font-weight:700;
    line-height:1.4;
}
.note{margin-top:15px;font-size:11px;opacity:.75}
</style>
</head>
<body>
<div class="box">
    <div class="icon">📧</div>
    <h2>Verify Your Email</h2>
    <div class="sub">
        We sent a verification code to<br>
        <span class="email" id="emailText"></span>
    </div>

    <form onsubmit="verifyEmail(event)">
        <input
            id="otp"
            type="text"
            inputmode="numeric"
            autocomplete="one-time-code"
            maxlength="8"
            placeholder="CODE"
            required>
        <button id="verifyButton" type="submit">Verify Email</button>
    </form>

    <button class="secondary" id="resendButton" onclick="resendCode()">
        Resend Code
    </button>

    <div class="message" id="message"></div>

    <div class="note">
        Your account will be available for login only after email verification.
    </div>
</div>

<script>
const SUPABASE_URL = "https://holelzxzhaiefaqezmce.supabase.co";
const SUPABASE_KEY = "sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const email = localStorage.getItem("lb_pending_signup_email") || "";

document.getElementById("emailText").textContent =
    email || "your email address";

function message(text,type="error"){
    const el=document.getElementById("message");
    el.textContent=text;
    el.style.color=type==="success" ? "#d9ffd9" : "#ffe0e0";
}

async function verifyEmail(event){
    event.preventDefault();

    const token=document.getElementById("otp").value.trim();
    const button=document.getElementById("verifyButton");

    if(!email){
        message("Signup email was not found. Please start signup again.");
        return;
    }

    if(!token){
        message("Please enter the verification code.");
        return;
    }

    button.disabled=true;
    button.textContent="Verifying...";
    message("");

    try{
        const {data,error}=await supabaseClient.auth.verifyOtp({
            email:email,
            token:token,
            type:"email"
        });

        if(error) throw error;
        if(!data.user) throw new Error("Email verification failed.");

        /* Create normal-user role only after successful verification. */
        const {error:roleError}=await supabaseClient
            .from("user_roles")
            .upsert(
                {user_id:data.user.id,role:"user"},
                {onConflict:"user_id"}
            );

        if(roleError){
            console.error(roleError);
            await supabaseClient.auth.signOut();
            throw new Error(
                "Email verified, but the user role could not be saved. Please contact admin."
            );
        }

        await supabaseClient.auth.signOut();

        localStorage.removeItem("lb_pending_signup_email");

        message(
            "Email verified successfully. You can now login.",
            "success"
        );

        setTimeout(function(){
            window.location.href="login.html";
        },1200);

    }catch(error){
        console.error(error);
        message(error.message || "Invalid or expired verification code.");
        button.disabled=false;
        button.textContent="Verify Email";
    }
}

async function resendCode(){
    if(!email){
        message("Signup email was not found. Please start signup again.");
        return;
    }

    const button=document.getElementById("resendButton");
    button.disabled=true;
    button.textContent="Sending...";

    try{
        const {error}=await supabaseClient.auth.resend({
            type:"signup",
            email:email
        });

        if(error) throw error;

        message("A new verification code has been sent.", "success");
    }catch(error){
        console.error(error);
        message(error.message || "Unable to resend verification code.");
    }

    button.disabled=false;
    button.textContent="Resend Code";
}
</script>
</body>
</html>
