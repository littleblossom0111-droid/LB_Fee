<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Little Blossoms</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   RESET
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


/* =========================
   BODY
========================= */

body{
    width:100%;
    height:100vh;
    overflow:hidden;

    background:#d9f1f5;

    position:relative;
}


/* =========================
   FULL BACKGROUND IMAGE
   BABY WILL NOT BE CROPPED
========================= */

.background-image{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    object-fit:contain;

    object-position:center center;

    z-index:0;

    background:#d9f1f5;
}


/* =========================
   SOFT OVERLAY
========================= */

.background-overlay{

    position:fixed;

    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,0.08),
            rgba(0,0,0,0.08)
        );

    z-index:1;

    pointer-events:none;
}


/* =========================
   MAIN HOME SCREEN
========================= */

.home-screen{

    position:relative;

    z-index:2;

    width:100%;
    height:100vh;

    display:flex;

    align-items:flex-end;

    justify-content:center;

    padding-bottom:55px;
}


/* =========================
   MAIN LOGIN BUTTON
========================= */

.open-login{

    border:0;

    padding:17px 55px;

    min-width:220px;

    border-radius:50px;

    color:white;

    font-size:18px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ff3f91,
            #ff765e,
            #ff9d4d
        );

    box-shadow:
        0 12px 35px rgba(0,0,0,.30);

    transition:.25s;
}


.open-login:hover{

    transform:translateY(-3px);

    box-shadow:
        0 18px 40px rgba(0,0,0,.35);
}


.open-login:active{

    transform:scale(.97);
}


/* =========================
   MODAL
========================= */

.login-modal{

    position:fixed;

    inset:0;

    z-index:10;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.28);

    backdrop-filter:blur(3px);

    -webkit-backdrop-filter:blur(3px);
}


/* SHOW MODAL */

.login-modal.show{

    display:flex;
}


/* =========================
   LOGIN CARD
========================= */

.login-card{

    width:92%;

    max-width:420px;

    max-height:92vh;

    overflow-y:auto;

    padding:30px 27px 25px;

    border-radius:30px;

    background:
        rgba(255,255,255,.76);

    backdrop-filter:blur(16px);

    -webkit-backdrop-filter:blur(16px);

    border:
        1px solid rgba(255,255,255,.8);

    box-shadow:
        0 25px 70px rgba(0,0,0,.35);

    position:relative;

    animation:
        cardOpen .3s ease;
}


@keyframes cardOpen{

    from{
        opacity:0;
        transform:translateY(30px) scale(.95);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}


/* =========================
   CLOSE BUTTON
========================= */

.close-btn{

    position:absolute;

    top:14px;
    right:17px;

    width:35px;
    height:35px;

    border:0;

    border-radius:50%;

    background:rgba(0,0,0,.07);

    color:#555;

    font-size:22px;

    cursor:pointer;
}


.close-btn:hover{

    background:rgba(255,80,130,.15);

    color:#e84f91;
}


/* =========================
   LOGO
========================= */

.logo{

    width:72px;
    height:72px;

    margin:5px auto 13px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:28px;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff4fa0,
            #b46bea,
            #45bdf5
        );

    border:3px solid white;

    box-shadow:
        0 8px 25px rgba(220,70,170,.35);
}


/* =========================
   TITLE
========================= */

h1{

    text-align:center;

    font-size:27px;

    color:#222;
}


.subtitle{

    text-align:center;

    color:#666;

    margin-top:6px;

    margin-bottom:20px;

    font-size:15px;
}


/* =========================
   LOGIN / SIGNUP TABS
========================= */

.tabs{

    display:flex;

    gap:6px;

    padding:5px;

    margin-bottom:20px;

    border-radius:14px;

    background:rgba(0,0,0,.06);
}


.tab{

    flex:1;

    padding:11px;

    border:0;

    border-radius:10px;

    background:transparent;

    color:#777;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}


.tab.active{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff4f9a,
            #ff7d65
        );

    box-shadow:
        0 5px 15px rgba(255,80,140,.20);
}


/* =========================
   FORM
========================= */

.form-box{

    display:none;
}


.form-box.active{

    display:block;
}


label{

    display:block;

    margin:14px 0 7px;

    color:#333;

    font-size:14px;

    font-weight:600;
}


input{

    width:100%;

    padding:14px 15px;

    border-radius:13px;

    border:
        1px solid rgba(100,100,100,.22);

    outline:none;

    background:
        rgba(255,255,255,.88);

    font-size:15px;

    color:#333;
}


input:focus{

    border-color:#ff70a8;

    box-shadow:
        0 0 0 4px rgba(255,100,160,.12);
}


/* =========================
   FORGOT PASSWORD
========================= */

.forgot{

    display:block;

    text-align:right;

    margin-top:10px;

    color:#e84f91;

    font-size:14px;

    font-weight:600;

    text-decoration:none;
}


.forgot:hover{

    text-decoration:underline;
}


/* =========================
   ACTION BUTTON
========================= */

.action-btn{

    width:100%;

    margin-top:20px;

    padding:14px;

    border:0;

    border-radius:13px;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ff4297,
            #ff7a65,
            #ff9a4e
        );

    box-shadow:
        0 9px 25px rgba(255,80,130,.28);

    transition:.2s;
}


.action-btn:hover{

    transform:translateY(-2px);
}


.action-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}


/* =========================
   MESSAGE
========================= */

.message{

    min-height:20px;

    margin-top:13px;

    text-align:center;

    font-size:13px;

    line-height:1.4;
}


/* =========================
   FOOTER
========================= */

.footer{

    text-align:center;

    margin-top:18px;

    color:#777;

    font-size:11px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .home-screen{

        padding-bottom:45px;
    }


    .open-login{

        width:75%;

        padding:16px;
    }


    .login-card{

        width:94%;

        padding:
            28px 21px 22px;

        border-radius:27px;
    }


    h1{

        font-size:25px;
    }

}


/* =========================
   SMALL HEIGHT PHONE
========================= */

@media(max-height:700px){

    .login-card{

        max-height:88vh;

        padding-top:22px;
    }


    .logo{

        width:60px;
        height:60px;

        font-size:24px;
    }


    .subtitle{

        margin-bottom:14px;
    }


    label{

        margin-top:10px;
    }


    input{

        padding:12px;
    }


    .action-btn{

        margin-top:15px;
    }
}

</style>

</head>


<body>


<!-- =========================
     BACKGROUND
========================= -->

<img
    src="daivik1.png"
    class="background-image"
    alt="Little Blossoms"
>


<div class="background-overlay"></div>



<!-- =========================
     HOME SCREEN
========================= -->

<div class="home-screen">

    <button
        class="open-login"
        id="openLogin"
    >
        Login / Sign Up
    </button>

</div>



<!-- =========================
     LOGIN MODAL
========================= -->

<div
    class="login-modal"
    id="loginModal"
>


    <div class="login-card">


        <!-- CLOSE -->

        <button
            class="close-btn"
            id="closeLogin"
            type="button"
        >
            ×
        </button>


        <!-- LOGO -->

        <div class="logo">
            LB
        </div>


        <h1>
            Little Blossoms
        </h1>


        <div class="subtitle">
            Management System
        </div>


        <!-- =====================
             TABS
        ====================== -->

        <div class="tabs">

            <button
                type="button"
                class="tab active"
                id="loginTab"
            >
                Login
            </button>


            <button
                type="button"
                class="tab"
                id="signupTab"
            >
                Sign Up
            </button>

        </div>



        <!-- =====================
             LOGIN FORM
        ====================== -->

        <div
            class="form-box active"
            id="loginBox"
        >

            <form id="loginForm">


                <label>
                    Email
                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label>
                    Password
                </label>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <a
                    href="reset-password.html"
                    class="forgot"
                >
                    Forgot Password?
                </a>


                <button
                    type="submit"
                    class="action-btn"
                    id="loginBtn"
                >
                    Login
                </button>


            </form>


            <div
                class="message"
                id="loginMessage"
            ></div>

        </div>



        <!-- =====================
             SIGN UP FORM
        ====================== -->

        <div
            class="form-box"
            id="signupBox"
        >

            <form id="signupForm">


                <label>
                    Email
                </label>


                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label>
                    Password
                </label>


                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <label>
                    Confirm Password
                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="action-btn"
                    id="signupBtn"
                >
                    Create Account
                </button>


            </form>


            <div
                class="message"
                id="signupMessage"
            ></div>

        </div>


        <div class="footer">
            Little Blossoms Preschool & Day Care
        </div>


    </div>

</div>



<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================
   ELEMENTS
========================= */

const openLogin =
document.getElementById("openLogin");

const closeLogin =
document.getElementById("closeLogin");

const loginModal =
document.getElementById("loginModal");

const loginTab =
document.getElementById("loginTab");

const signupTab =
document.getElementById("signupTab");

const loginBox =
document.getElementById("loginBox");

const signupBox =
document.getElementById("signupBox");


/* =========================
   OPEN LOGIN CARD
========================= */

openLogin.addEventListener(
    "click",
    function(){

        loginModal.classList.add("show");

    }
);


/* =========================
   CLOSE LOGIN CARD
========================= */

closeLogin.addEventListener(
    "click",
    function(){

        loginModal.classList.remove("show");

    }
);


/* =========================
   CLICK OUTSIDE CARD
========================= */

loginModal.addEventListener(
    "click",
    function(e){

        if(e.target === loginModal){

            loginModal.classList.remove("show");

        }

    }
);


/* =========================
   LOGIN TAB
========================= */

loginTab.addEventListener(
    "click",
    function(){

        loginTab.classList.add("active");

        signupTab.classList.remove("active");

        loginBox.classList.add("active");

        signupBox.classList.remove("active");

    }
);


/* =========================
   SIGNUP TAB
========================= */

signupTab.addEventListener(
    "click",
    function(){

        signupTab.classList.add("active");

        loginTab.classList.remove("active");

        signupBox.classList.add("active");

        loginBox.classList.remove("active");

    }
);


/* =========================
   LOGIN
========================= */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("loginPassword")
            .value;


        const button =
            document
            .getElementById("loginBtn");


        const message =
            document
            .getElementById("loginMessage");


        button.disabled = true;

        button.textContent =
            "Logging in...";

        message.textContent = "";


        try{

            const { data, error } =
                await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled = false;

                button.textContent =
                    "Login";

                return;
            }


            message.style.color =
                "#16a34a";

            message.textContent =
                "Login successful...";


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                700
            );


        }
        catch(error){

            console.error(error);

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled = false;

            button.textContent =
                "Login";
        }

    }
);


/* =========================
   SIGN UP
========================= */

document
.getElementById("signupForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("signupEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("signupPassword")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        const button =
            document
            .getElementById("signupBtn");


        const message =
            document
            .getElementById("signupMessage");


        /* PASSWORD CHECK */

        if(password !== confirmPassword){

            message.style.color =
                "#e53935";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        if(password.length < 6){

            message.style.color =
                "#e53935";

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        button.disabled = true;

        button.textContent =
            "Creating Account...";

        message.textContent = "";


        try{

            const { data, error } =
                await supabaseClient
                .auth
                .signUp({

                    email:email,

                    password:password

                });


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled = false;

                button.textContent =
                    "Create Account";

                return;
            }


            message.style.color =
                "#16a34a";


            /*
              Supabase email confirmation
              enabled ho to user ko email
              confirm karna padega.
            */

            if(
                data &&
                data.user &&
                data.user.identities &&
                data.user.identities.length === 0
            ){

                message.textContent =
                    "This email is already registered.";

            }
            else{

                message.textContent =
                    "Account created successfully. Please check your email if confirmation is required.";

            }


            button.disabled = false;

            button.textContent =
                "Create Account";


        }
        catch(error){

            console.error(error);

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled = false;

            button.textContent =
                "Create Account";
        }

    }
);

</script>

</body>
</html>
