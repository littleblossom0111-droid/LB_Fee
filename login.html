<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Little Blossoms</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;
}


/* =====================================================
   BODY
===================================================== */

body{

    position:relative;

    background:#d8f2f6;
}


/* =====================================================
   BACKGROUND IMAGE
===================================================== */

.background-image{

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100dvh;

    object-fit:contain;

    object-position:center center;

    background:#d8f2f6;

    z-index:0;

    display:block;
}


/* =====================================================
   BACKGROUND OVERLAY
===================================================== */

.background-overlay{

    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            rgba(0,0,0,0.05),
            rgba(0,0,0,0.05)
        );

    z-index:1;

    pointer-events:none;
}


/* =====================================================
   HOME SCREEN
===================================================== */

.home-screen{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:2;

    pointer-events:none;
}


/* =====================================================
   LOGIN / SIGN UP BUTTON
===================================================== */

.open-login{

    position:fixed;

    left:50%;

    bottom:
        calc(
            24px +
            env(safe-area-inset-bottom)
        );

    transform:translateX(-50%);

    width:min(320px,82vw);

    min-height:56px;

    padding:15px 25px;

    border:0;

    border-radius:50px;

    color:white;

    font-size:18px;

    font-weight:700;

    letter-spacing:.2px;

    background:
        linear-gradient(
            135deg,
            #ff3190,
            #ff725f,
            #ff9d4c
        );

    box-shadow:
        0 12px 35px rgba(0,0,0,.35);

    cursor:pointer;

    pointer-events:auto;

    z-index:5;

    transition:
        transform .2s,
        box-shadow .2s;
}


.open-login:hover{

    transform:
        translateX(-50%)
        translateY(-2px);

    box-shadow:
        0 17px 40px rgba(0,0,0,.40);
}


.open-login:active{

    transform:
        translateX(-50%)
        scale(.97);
}


/* =====================================================
   MODAL
===================================================== */

.login-modal{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:20;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.25);

    backdrop-filter:
        blur(3px);

    -webkit-backdrop-filter:
        blur(3px);
}


/* SHOW */

.login-modal.show{

    display:flex;
}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card{

    position:relative;

    width:min(420px,94vw);

    max-height:
        calc(
            100dvh -
            30px
        );

    overflow-y:auto;

    padding:
        28px 25px 23px;

    border-radius:30px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid
        rgba(255,255,255,.85);

    backdrop-filter:
        blur(18px);

    -webkit-backdrop-filter:
        blur(18px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    animation:
        cardOpen .3s ease;

    scrollbar-width:none;
}


.login-card::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   CARD ANIMATION
===================================================== */

@keyframes cardOpen{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

.close-btn{

    position:absolute;

    top:13px;
    right:15px;

    width:36px;
    height:36px;

    border:0;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.07);

    color:#555;

    font-size:23px;

    line-height:1;

    cursor:pointer;

    z-index:3;
}


.close-btn:hover{

    background:
        rgba(255,70,130,.15);

    color:#e84f91;
}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:70px;
    height:70px;

    margin:
        3px auto 13px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:28px;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff4ca0,
            #b36ce9,
            #43bdf4
        );

    border:
        3px solid
        rgba(255,255,255,.9);

    box-shadow:
        0 8px 25px
        rgba(220,70,170,.35);
}


/* =====================================================
   TITLE
===================================================== */

h1{

    text-align:center;

    color:#222;

    font-size:27px;

    font-weight:700;
}


.subtitle{

    text-align:center;

    color:#666;

    margin:
        6px 0 19px;

    font-size:15px;
}


/* =====================================================
   TABS
===================================================== */

.tabs{

    display:flex;

    gap:6px;

    padding:5px;

    margin-bottom:18px;

    border-radius:14px;

    background:
        rgba(0,0,0,.06);
}


.tab{

    flex:1;

    border:0;

    padding:11px 8px;

    border-radius:10px;

    background:transparent;

    color:#777;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;

    transition:.2s;
}


.tab.active{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff4298,
            #ff7864
        );

    box-shadow:
        0 5px 15px
        rgba(255,80,140,.20);
}


/* =====================================================
   FORM BOX
===================================================== */

.form-box{

    display:none;
}


.form-box.active{

    display:block;
}


/* =====================================================
   LABEL
===================================================== */

label{

    display:block;

    margin:
        13px 0 7px;

    color:#333;

    font-size:14px;

    font-weight:600;
}


/* =====================================================
   INPUT
===================================================== */

input{

    width:100%;

    min-height:48px;

    padding:
        13px 15px;

    border:
        1px solid
        rgba(100,100,100,.22);

    border-radius:13px;

    outline:none;

    background:
        rgba(255,255,255,.88);

    color:#333;

    font-size:15px;

    transition:.2s;
}


input::placeholder{

    color:#888;
}


input:focus{

    border-color:#ff70a8;

    background:#fff;

    box-shadow:
        0 0 0 4px
        rgba(255,100,160,.12);
}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

.forgot{

    display:block;

    text-align:right;

    margin-top:10px;

    color:#e84f91;

    font-size:14px;

    font-weight:600;

    text-decoration:none;
}


.forgot:hover{

    text-decoration:underline;
}


/* =====================================================
   ACTION BUTTON
===================================================== */

.action-btn{

    width:100%;

    min-height:50px;

    margin-top:19px;

    padding:13px;

    border:0;

    border-radius:13px;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ff4297,
            #ff7864,
            #ff9b4e
        );

    box-shadow:
        0 9px 25px
        rgba(255,80,130,.28);

    transition:.2s;
}


.action-btn:hover{

    transform:
        translateY(-2px);
}


.action-btn:active{

    transform:
        scale(.98);
}


.action-btn:disabled{

    opacity:.6;

    cursor:not-allowed;

    transform:none;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    min-height:20px;

    margin-top:12px;

    text-align:center;

    font-size:13px;

    line-height:1.4;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    margin-top:17px;

    color:#777;

    font-size:11px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:767px){

    .background-image{

        width:100vw;

        height:100dvh;

        object-fit:contain;

        object-position:center center;
    }


    .open-login{

        bottom:
            calc(
                20px +
                env(safe-area-inset-bottom)
            );

        width:78vw;

        max-width:320px;

        min-height:54px;

        font-size:17px;
    }


    .login-card{

        width:94vw;

        max-width:420px;

        max-height:
            calc(
                100dvh - 24px
            );

        padding:
            25px 20px 20px;

        border-radius:27px;
    }


    .logo{

        width:64px;
        height:64px;

        font-size:25px;
    }


    h1{

        font-size:25px;
    }


    .subtitle{

        font-size:14px;

        margin-bottom:16px;
    }


    label{

        margin-top:11px;
    }


    input{

        min-height:47px;

        padding:12px 14px;
    }


    .action-btn{

        min-height:48px;

        margin-top:17px;
    }
}


/* =====================================================
   SMALL MOBILE HEIGHT
===================================================== */

@media(
    max-width:480px
) and (
    max-height:700px
){

    .login-card{

        padding:
            20px 19px 18px;
    }


    .logo{

        width:57px;
        height:57px;

        font-size:23px;

        margin-bottom:8px;
    }


    h1{

        font-size:23px;
    }


    .subtitle{

        margin-bottom:12px;
    }


    .tabs{

        margin-bottom:12px;
    }


    label{

        margin-top:8px;

        margin-bottom:5px;
    }


    input{

        min-height:44px;

        padding:10px 13px;
    }


    .action-btn{

        min-height:45px;

        margin-top:14px;
    }


    .footer{

        margin-top:12px;
    }
}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:768px){

    .background-image{

        object-fit:contain;
    }


    .open-login{

        bottom:40px;

        width:280px;
    }
}

</style>

</head>


<body>


<!-- =================================================
     BACKGROUND IMAGE
================================================= -->

<img
    src="daivik1.png"
    class="background-image"
    alt="Little Blossoms Background"
>


<div class="background-overlay"></div>



<!-- =================================================
     HOME SCREEN
================================================= -->

<div class="home-screen">

    <button
        type="button"
        class="open-login"
        id="openLogin"
    >
        Login / Sign Up
    </button>

</div>



<!-- =================================================
     LOGIN MODAL
================================================= -->

<div
    class="login-modal"
    id="loginModal"
>


    <div class="login-card">


        <!-- CLOSE BUTTON -->

        <button
            type="button"
            class="close-btn"
            id="closeLogin"
        >
            ×
        </button>



        <!-- LOGO -->

        <div class="logo">
            LB
        </div>


        <h1>
            Little Blossoms
        </h1>


        <div class="subtitle">
            Management System
        </div>



        <!-- =================================================
             TABS
        ================================================= -->

        <div class="tabs">

            <button
                type="button"
                class="tab active"
                id="loginTab"
            >
                Login
            </button>


            <button
                type="button"
                class="tab"
                id="signupTab"
            >
                Sign Up
            </button>

        </div>



        <!-- =================================================
             LOGIN FORM
        ================================================= -->

        <div
            class="form-box active"
            id="loginBox"
        >

            <form id="loginForm">


                <label for="loginEmail">
                    Email
                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label for="loginPassword">
                    Password
                </label>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <a
                    href="reset-password.html"
                    class="forgot"
                >
                    Forgot Password?
                </a>


                <button
                    type="submit"
                    class="action-btn"
                    id="loginBtn"
                >
                    Login
                </button>


            </form>


            <div
                class="message"
                id="loginMessage"
            ></div>

        </div>



        <!-- =================================================
             SIGN UP FORM
        ================================================= -->

        <div
            class="form-box"
            id="signupBox"
        >

            <form id="signupForm">


                <label for="signupEmail">
                    Email
                </label>


                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label for="signupPassword">
                    Password
                </label>


                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <label for="confirmPassword">
                    Confirm Password
                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="action-btn"
                    id="signupBtn"
                >
                    Create Account
                </button>


            </form>


            <div
                class="message"
                id="signupMessage"
            ></div>

        </div>



        <div class="footer">
            Little Blossoms Preschool & Day Care
        </div>


    </div>

</div>



<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const openLogin =
document.getElementById("openLogin");

const closeLogin =
document.getElementById("closeLogin");

const loginModal =
document.getElementById("loginModal");

const loginTab =
document.getElementById("loginTab");

const signupTab =
document.getElementById("signupTab");

const loginBox =
document.getElementById("loginBox");

const signupBox =
document.getElementById("signupBox");


/* =====================================================
   OPEN LOGIN CARD
===================================================== */

openLogin.addEventListener(
    "click",
    function(){

        loginModal.classList.add("show");

    }
);


/* =====================================================
   CLOSE LOGIN CARD
===================================================== */

closeLogin.addEventListener(
    "click",
    function(){

        loginModal.classList.remove("show");

    }
);


/* =====================================================
   CLICK OUTSIDE CARD
===================================================== */

loginModal.addEventListener(
    "click",
    function(e){

        if(e.target === loginModal){

            loginModal.classList.remove("show");

        }

    }
);


/* =====================================================
   LOGIN TAB
===================================================== */

loginTab.addEventListener(
    "click",
    function(){

        loginTab.classList.add("active");

        signupTab.classList.remove("active");

        loginBox.classList.add("active");

        signupBox.classList.remove("active");

    }
);


/* =====================================================
   SIGN UP TAB
===================================================== */

signupTab.addEventListener(
    "click",
    function(){

        signupTab.classList.add("active");

        loginTab.classList.remove("active");

        signupBox.classList.add("active");

        loginBox.classList.remove("active");

    }
);


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("loginPassword")
            .value;


        const button =
            document
            .getElementById("loginBtn");


        const message =
            document
            .getElementById("loginMessage");


        button.disabled = true;

        button.textContent =
            "Logging in...";

        message.textContent = "";


        try{

            const { data, error } =
                await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled = false;

                button.textContent =
                    "Login";

                return;
            }


            message.style.color =
                "#16a34a";

            message.textContent =
                "Login successful...";


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                700
            );


        }
        catch(error){

            console.error(error);

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled = false;

            button.textContent =
                "Login";
        }

    }
);


/* =====================================================
   SIGN UP
===================================================== */

document
.getElementById("signupForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("signupEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("signupPassword")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        const button =
            document
            .getElementById("signupBtn");


        const message =
            document
            .getElementById("signupMessage");


        /* PASSWORD MATCH */

        if(password !== confirmPassword){

            message.style.color =
                "#e53935";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        /* PASSWORD LENGTH */

        if(password.length < 6){

            message.style.color =
                "#e53935";

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        button.disabled = true;

        button.textContent =
            "Creating Account...";

        message.textContent = "";


        try{

            const { data, error } =
                await supabaseClient
                .auth
                .signUp({

                    email:email,

                    password:password

                });


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled = false;

                button.textContent =
                    "Create Account";

                return;
            }


            message.style.color =
                "#16a34a";


            if(
                data &&
                data.user &&
                data.user.identities &&
                data.user.identities.length === 0
            ){

                message.textContent =
                    "This email is already registered.";

            }
            else{

                message.textContent =
                    "Account created successfully. Please check your email if confirmation is required.";

            }


            button.disabled = false;

            button.textContent =
                "Create Account";


        }
        catch(error){

            console.error(error);

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled = false;

            button.textContent =
                "Create Account";
        }

    }
);

</script>

</body>
</html>
