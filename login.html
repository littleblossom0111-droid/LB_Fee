<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Little Blossoms | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    font-family:Arial, Helvetica, sans-serif;

    display:flex;
    justify-content:center;
    align-items:center;

    background:
        linear-gradient(
            rgba(255,255,255,0.35),
            rgba(255,255,255,0.35)
        ),
        url("daivik1.png");

    background-size:cover;
    background-position:center;

    padding:20px;
}

/* MAIN CARD */

.login-container{
    width:100%;
    max-width:430px;

    background:rgba(255,255,255,0.96);

    border-radius:24px;

    padding:30px 25px;

    box-shadow:
        0 25px 70px rgba(0,0,0,0.20);

    backdrop-filter:blur(10px);
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:18px;
}

.logo-icon{
    width:70px;
    height:70px;

    margin:auto;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    box-shadow:
        0 10px 25px rgba(139,92,246,0.30);
}

.logo h1{
    margin-top:12px;

    font-size:25px;

    color:#222;
}

.logo p{
    margin-top:5px;

    color:#777;

    font-size:13px;
}

/* TABS */

.tabs{
    display:grid;

    grid-template-columns:1fr 1fr;

    background:#f3f4f6;

    border-radius:13px;

    padding:4px;

    margin:25px 0 20px;
}

.tab{
    border:0;

    background:transparent;

    padding:11px;

    border-radius:10px;

    font-size:14px;

    font-weight:700;

    color:#777;

    cursor:pointer;
}

.tab.active{
    background:white;

    color:#8b5cf6;

    box-shadow:
        0 3px 10px rgba(0,0,0,0.08);
}

/* FORM */

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

    color:#333;
}

.form-group input{
    width:100%;

    padding:13px 14px;

    border:1px solid #ddd;

    border-radius:12px;

    outline:none;

    font-size:14px;

    transition:0.2s;
}

.form-group input:focus{
    border-color:#8b5cf6;

    box-shadow:
        0 0 0 3px rgba(139,92,246,0.10);
}

/* LOGIN ROLE */

.login-role{
    margin-top:4px;

    margin-bottom:17px;
}

.login-role label{
    display:block;

    margin-bottom:8px;

    font-size:13px;

    font-weight:700;

    color:#333;
}

.role-options{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:9px;
}

.role-option{
    border:1px solid #e2e2e2;

    background:#fafafa;

    color:#666;

    border-radius:12px;

    padding:12px 8px;

    font-size:13px;

    font-weight:700;

    cursor:pointer;

    transition:0.2s;
}

.role-option:hover{
    border-color:#c4b5fd;
}

.role-option.active{
    color:white;

    border-color:#8b5cf6;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    box-shadow:
        0 6px 15px rgba(139,92,246,0.20);
}

/* FORGOT PASSWORD */

.forgot{
    text-align:right;

    margin-top:-5px;

    margin-bottom:18px;
}

.forgot a{
    color:#8b5cf6;

    font-size:12px;

    font-weight:700;

    text-decoration:none;

    cursor:pointer;
}

/* BUTTON */

.main-btn{
    width:100%;

    border:0;

    border-radius:13px;

    padding:14px;

    color:white;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    box-shadow:
        0 8px 20px rgba(139,92,246,0.25);

    transition:0.2s;
}

.main-btn:hover{
    transform:translateY(-1px);
}

.main-btn:disabled{
    opacity:0.65;

    cursor:not-allowed;

    transform:none;
}

/* MESSAGE */

.message{
    min-height:20px;

    margin-top:14px;

    text-align:center;

    font-size:13px;

    font-weight:600;
}

/* SIGNUP */

.signup-note{
    text-align:center;

    margin-top:20px;

    font-size:12px;

    color:#777;

    line-height:1.5;
}

/* FOOTER */

.footer{
    text-align:center;

    margin-top:20px;

    color:#999;

    font-size:11px;
}

/* HIDDEN */

.hidden{
    display:none !important;
}

/* MOBILE */

@media(max-width:480px){

    .login-container{
        padding:26px 20px;

        border-radius:21px;
    }

    .logo-icon{
        width:62px;
        height:62px;

        font-size:30px;
    }

    .logo h1{
        font-size:23px;
    }
}

</style>

</head>

<body>

<div class="login-container">

    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            🌸
        </div>

        <h1>Little Blossoms</h1>

        <p>Preschool & Day Care Management</p>

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            type="button"
            class="tab active"
            id="loginTab"
            onclick="showLogin()">

            Login

        </button>

        <button
            type="button"
            class="tab"
            id="signupTab"
            onclick="showSignup()">

            Sign Up

        </button>

    </div>


    <!-- LOGIN FORM -->

    <form
        id="loginForm"
        onsubmit="loginUser(event)">

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Enter your email"
                required
                autocomplete="email">

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="loginPassword"
                placeholder="Enter your password"
                required
                autocomplete="current-password">

        </div>


        <!-- ROLE -->

        <div class="login-role">

            <label>Login As</label>

            <div class="role-options">

                <button
                    type="button"
                    class="role-option active"
                    id="normalRole"
                    onclick="selectLoginRole('user')">

                    👤 Normal User

                </button>


                <button
                    type="button"
                    class="role-option"
                    id="adminRole"
                    onclick="selectLoginRole('admin')">

                    👑 Admin

                </button>

            </div>

        </div>


        <div class="forgot">

            <a onclick="forgotPassword()">
                Forgot Password?
            </a>

        </div>


        <button
            type="submit"
            class="main-btn"
            id="loginButton">

            Login

        </button>

    </form>


    <!-- SIGNUP FORM -->

    <form
        id="signupForm"
        class="hidden"
        onsubmit="signupUser(event)">

        <div class="form-group">

            <label>Email Address</label>

            <input
                type="email"
                id="signupEmail"
                placeholder="Enter your email"
                required
                autocomplete="email">

        </div>


        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="signupPassword"
                placeholder="Create password"
                minlength="6"
                required
                autocomplete="new-password">

        </div>


        <div class="form-group">

            <label>Confirm Password</label>

            <input
                type="password"
                id="signupConfirm"
                placeholder="Confirm password"
                minlength="6"
                required
                autocomplete="new-password">

        </div>


        <button
            type="submit"
            class="main-btn"
            id="signupButton">

            Create Account

        </button>

    </form>


    <!-- MESSAGE -->

    <div
        class="message"
        id="message">
    </div>


    <div class="signup-note">

        🔐 Your account permissions are controlled
        securely by Supabase.

    </div>


    <div class="footer">

        © 2026 Little Blossoms Preschool & Day Care

    </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIG
========================================================= */

const SUPABASE_URL =
    "https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   SELECTED LOGIN ROLE
========================================================= */

let selectedLoginRole = "user";


function selectLoginRole(role){

    selectedLoginRole = role;


    document
        .getElementById("normalRole")
        .classList
        .toggle(
            "active",
            role === "user"
        );


    document
        .getElementById("adminRole")
        .classList
        .toggle(
            "active",
            role === "admin"
        );

}


/* =========================================================
   TABS
========================================================= */

function showLogin(){

    document
        .getElementById("loginForm")
        .classList
        .remove("hidden");


    document
        .getElementById("signupForm")
        .classList
        .add("hidden");


    document
        .getElementById("loginTab")
        .classList
        .add("active");


    document
        .getElementById("signupTab")
        .classList
        .remove("active");


    clearMessage();

}


function showSignup(){

    document
        .getElementById("signupForm")
        .classList
        .remove("hidden");


    document
        .getElementById("loginForm")
        .classList
        .add("hidden");


    document
        .getElementById("signupTab")
        .classList
        .add("active");


    document
        .getElementById("loginTab")
        .classList
        .remove("active");


    clearMessage();

}


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(
    text,
    type = "error"
){

    const message =
        document.getElementById("message");


    message.textContent = text;


    if(type === "success"){

        message.style.color = "#16a34a";

    }
    else{

        message.style.color = "#dc2626";

    }

}


function clearMessage(){

    document
        .getElementById("message")
        .textContent = "";

}


/* =========================================================
   LOGIN
========================================================= */

async function loginUser(event){

    event.preventDefault();


    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    const button =
        document.getElementById("loginButton");


    button.disabled = true;

    button.textContent = "Checking...";

    clearMessage();


    try{

        /* -----------------------------------------
           SIGN IN
        ----------------------------------------- */

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({

            email: email,

            password: password

        });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "Login failed."
            );

        }


        /* -----------------------------------------
           GET ACTUAL ROLE FROM DATABASE
        ----------------------------------------- */

        const {
            data: roleData,
            error: roleError
        } =
        await supabaseClient
        .from("user_roles")
        .select("role")
        .eq(
            "user_id",
            data.user.id
        )
        .maybeSingle();


        if(roleError){

            await supabaseClient.auth.signOut();

            throw new Error(
                "Permission check failed. Please contact Admin."
            );

        }


        /*
          No role row = NOT ADMIN.
          Treat it as normal user only.
        */

        const actualRole =
            roleData?.role || "user";


        /* -----------------------------------------
           ADMIN SELECTED
        ----------------------------------------- */

        if(selectedLoginRole === "admin"){

            if(actualRole !== "admin"){

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "This account does not have Admin permission."
                );

            }

        }


        /* -----------------------------------------
           NORMAL USER SELECTED
        ----------------------------------------- */

        if(selectedLoginRole === "user"){

            if(actualRole !== "user"){

                await supabaseClient
                    .auth
                    .signOut();


                throw new Error(
                    "This is an Admin account. Please select Admin Login."
                );

            }

        }


        /* -----------------------------------------
           SAVE ROLE FOR UI ONLY
           
           IMPORTANT:
           Database RLS remains the real security.
        ----------------------------------------- */

        sessionStorage.setItem(
            "lb_role",
            actualRole
        );


        sessionStorage.setItem(
            "lb_user_email",
            data.user.email || ""
        );


        /* -----------------------------------------
           SUCCESS
        ----------------------------------------- */

        showMessage(
            "Login successful. Opening dashboard...",
            "success"
        );


        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        }, 500);


    }
    catch(error){

        console.error(
            "Login Error:",
            error
        );


        showMessage(
            error.message ||
            "Login failed. Please try again."
        );


        button.disabled = false;

        button.textContent = "Login";

    }

}


/* =========================================================
   SIGN UP
========================================================= */

async function signupUser(event){

    event.preventDefault();


    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("signupPassword")
        .value;


    const confirmPassword =
        document
        .getElementById("signupConfirm")
        .value;


    const button =
        document.getElementById("signupButton");


    clearMessage();


    /* -----------------------------------------
       PASSWORD CHECK
    ----------------------------------------- */

    if(password !== confirmPassword){

        showMessage(
            "Passwords do not match."
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters."
        );

        return;

    }


    button.disabled = true;

    button.textContent = "Creating...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signUp({

            email: email,

            password: password

        });


        if(error){

            throw error;

        }


        /*
          New account automatically becomes
          Normal User through the Supabase trigger.
        */


        if(data.session){

            await supabaseClient
                .auth
                .signOut();

        }


        showMessage(
            "Account created successfully. You can now login as Normal User.",
            "success"
        );


        document
            .getElementById("signupForm")
            .reset();


        setTimeout(function(){

            showLogin();

            document
                .getElementById("loginEmail")
                .value = email;

        }, 1200);


    }
    catch(error){

        console.error(
            "Signup Error:",
            error
        );


        showMessage(
            error.message ||
            "Could not create account."
        );


        button.disabled = false;

        button.textContent =
            "Create Account";

    }

}


/* =========================================================
   FORGOT PASSWORD
========================================================= */

async function forgotPassword(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    if(!email){

        showMessage(
            "Please enter your email address first."
        );

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient
        .auth
        .resetPasswordForEmail(
            email,
            {
                redirectTo:
                    window.location.origin +
                    "/reset-password.html"
            }
        );


        if(error){

            throw error;

        }


        showMessage(
            "Password reset link has been sent to your email.",
            "success"
        );

    }
    catch(error){

        console.error(
            "Reset Error:",
            error
        );


        showMessage(
            error.message ||
            "Could not send reset email."
        );

    }

}


/* =========================================================
   CHECK EXISTING SESSION
========================================================= */

async function checkExistingSession(){

    try{

        const {
            data
        } =
        await supabaseClient
        .auth
        .getSession();


        if(data.session){

            /*
              User is already logged in.
              Let dashboard perform the actual
              permission check.
            */

            window.location.href =
                "dashboard.html";

        }

    }
    catch(error){

        console.error(
            "Session Check:",
            error
        );

    }

}


/* =========================================================
   START
========================================================= */

checkExistingSession();

</script>

</body>
</html>
