<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Blossoms - Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    position:relative;
    overflow:hidden;

    /* Background Photo */
    background-image:
        linear-gradient(
            rgba(0,0,0,.30),
            rgba(0,0,0,.30)
        ),
        url("daivik1.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    background-attachment:fixed;
}

/* Premium soft overlay */
body::before{
    content:"";
    position:absolute;
    inset:0;
    background:
        radial-gradient(
            circle at top left,
            rgba(255,255,255,.18),
            transparent 35%
        ),
        radial-gradient(
            circle at bottom right,
            rgba(255,255,255,.12),
            transparent 35%
        );
    pointer-events:none;
}

/* Login Card */
.login-box{
    position:relative;
    z-index:2;

    width:92%;
    max-width:400px;

    background:rgba(255,255,255,.94);

    padding:35px 28px;

    border-radius:24px;

    border:1px solid rgba(255,255,255,.7);

    box-shadow:
        0 20px 60px rgba(0,0,0,.30),
        0 5px 20px rgba(0,0,0,.10);

    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
}

.logo{
    width:75px;
    height:75px;

    margin:0 auto 15px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        135deg,
        #ff7eb3,
        #65c7f7
    );

    color:white;

    font-size:30px;
    font-weight:bold;

    box-shadow:
        0 8px 25px rgba(255,114,167,.35);
}

h1{
    text-align:center;
    color:#333;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#888;
    margin:8px 0 28px;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#444;
    font-weight:600;
}

input{
    width:100%;

    padding:14px;

    border:1px solid #ddd;

    border-radius:12px;

    outline:none;

    font-size:15px;

    background:rgba(255,255,255,.95);

    transition:.2s;
}

input:focus{
    border-color:#ff72a7;

    box-shadow:
        0 0 0 3px rgba(255,114,167,.12);
}

button{
    width:100%;

    margin-top:24px;

    padding:14px;

    border:0;

    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #ff72a7,
            #ff9a62
        );

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
        0 8px 20px rgba(255,114,167,.25);

    transition:.2s;
}

button:hover{
    transform:translateY(-1px);

    box-shadow:
        0 10px 25px rgba(255,114,167,.35);
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

.forgot{
    display:block;

    text-align:right;

    margin-top:12px;

    color:#e85d93;

    font-size:14px;

    font-weight:600;

    text-decoration:none;

    cursor:pointer;
}

.forgot:hover{
    text-decoration:underline;
}

#message{
    margin-top:15px;

    text-align:center;

    font-size:14px;

    line-height:1.5;
}

.footer{
    text-align:center;

    margin-top:25px;

    color:#999;

    font-size:12px;
}
</style>
</head>

<body>

<div class="login-box">

    <div class="logo">LB</div>

    <h1>Little Blossoms</h1>

    <div class="subtitle">
        Management System
    </div>

    <form id="loginForm">

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
            required
        >

        <label>Password</label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required
        >

        <a
            href="reset-password.html"
            class="forgot"
        >
            Forgot Password?
        </a>

        <button
            type="submit"
            id="loginBtn"
        >
            Login
        </button>

    </form>

    <div id="message"></div>

    <div class="footer">
        Little Blossoms Preschool & Day Care
    </div>

</div>

<script>

const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const form =
document.getElementById("loginForm");

const button =
document.getElementById("loginBtn");

const message =
document.getElementById("message");


form.addEventListener(
    "submit",
    async function(e){

    e.preventDefault();

    const email =
        document
        .getElementById("email")
        .value
        .trim();

    const password =
        document
        .getElementById("password")
        .value;

    button.disabled = true;

    button.textContent =
        "Logging in...";

    message.textContent = "";

    try{

        const { data, error } =
            await supabaseClient.auth
            .signInWithPassword({
                email: email,
                password: password
            });

        if(error){

            message.style.color =
                "#e53935";

            message.textContent =
                error.message;

            button.disabled = false;

            button.textContent =
                "Login";

            return;
        }

        message.style.color =
            "#16a34a";

        message.textContent =
            "Login successful...";

        setTimeout(() => {

            window.location.href =
                "dashboard.html";

        },700);

    }
    catch(err){

        message.style.color =
            "#e53935";

        message.textContent =
            "Something went wrong. Please try again.";

        button.disabled = false;

        button.textContent =
            "Login";
    }

});

</script>

</body>
</html>
