<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Blossoms | Login</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;

    background:
        linear-gradient(
            rgba(0,0,0,.22),
            rgba(0,0,0,.28)
        ),
        url("daivik1.png");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;
}

/* BACKGROUND DARK OVERLAY */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        linear-gradient(
            180deg,
            rgba(0,0,0,.08),
            rgba(0,0,0,.30)
        );

    z-index:-1;
}

/* LOGIN CARD */

.login-card{
    width:100%;
    max-width:420px;

    padding:28px 24px;

    border:1px solid rgba(255,255,255,.35);

    border-radius:28px;

    background:rgba(255,255,255,.16);

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.30);

    color:white;
}

/* LOGO */

.logo{
    text-align:center;
    margin-bottom:22px;
}

.logo-icon{
    width:68px;
    height:68px;

    margin:auto;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(255,255,255,.20);

    border:1px solid rgba(255,255,255,.40);

    font-size:34px;

    box-shadow:
        0 8px 25px rgba(0,0,0,.20);
}

.logo h1{
    margin-top:12px;

    font-size:25px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.35);
}

.logo p{
    margin-top:5px;

    font-size:12px;

    opacity:.90;
}

/* TABS */

.tabs{
    display:grid;

    grid-template-columns:1fr 1fr 1fr;

    gap:5px;

    padding:5px;

    margin-bottom:22px;

    border-radius:15px;

    background:rgba(0,0,0,.18);
}

.tab{
    border:0;

    padding:11px 5px;

    border-radius:11px;

    background:transparent;

    color:rgba(255,255,255,.78);

    font-size:12px;
    font-weight:700;

    cursor:pointer;

    transition:.25s;
}

.tab.active{
    background:rgba(255,255,255,.92);

    color:#7c3aed;

    box-shadow:
        0 5px 15px rgba(0,0,0,.18);
}

/* FORM */

.form-group{
    margin-bottom:16px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;

    color:white;
}

.form-group input{
    width:100%;

    padding:14px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.35);

    outline:none;

    background:rgba(255,255,255,.18);

    color:white;

    font-size:14px;

    backdrop-filter:blur(5px);
}

.form-group input::placeholder{
    color:rgba(255,255,255,.78);
}

.form-group input:focus{
    border-color:white;

    background:rgba(255,255,255,.24);
}

/* ROLE TITLE */

.login-title{
    text-align:center;

    margin-bottom:17px;

    font-size:14px;

    font-weight:700;
}

.login-title span{
    display:inline-block;

    padding:7px 15px;

    border-radius:20px;

    background:rgba(255,255,255,.18);

    border:1px solid rgba(255,255,255,.25);
}

/* FORGOT */

.forgot{
    text-align:right;

    margin-top:-5px;

    margin-bottom:17px;
}

.forgot a{
    color:white;

    font-size:12px;

    font-weight:700;

    text-decoration:none;

    cursor:pointer;
}

/* MAIN BUTTON */

.main-btn{
    width:100%;

    padding:14px;

    border:0;

    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    color:white;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    box-shadow:
        0 8px 22px rgba(0,0,0,.25);

    transition:.2s;
}

.main-btn:hover{
    transform:translateY(-1px);
}

.main-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

/* MESSAGE */

.message{
    min-height:20px;

    margin-top:14px;

    text-align:center;

    font-size:12px;

    font-weight:700;
}

/* FOOTER */

.footer{
    text-align:center;

    margin-top:18px;

    font-size:11px;

    color:rgba(255,255,255,.75);
}

/* HIDDEN */

.hidden{
    display:none!important;
}

/* MOBILE */

@media(max-width:480px){

    body{
        padding:15px;
        background-position:center;
    }

    .login-card{
        padding:25px 19px;
        border-radius:24px;
    }

    .logo h1{
        font-size:23px;
    }

    .tab{
        font-size:11px;
        padding:10px 3px;
    }
}
</style>
</head>

<body>

<div class="login-card">

    <!-- LOGO -->

    <div class="logo">

        <div class="logo-icon">
            🌸
        </div>

        <h1>Little Blossoms</h1>

        <p>Preschool & Day Care Management</p>

    </div>


    <!-- TABS -->

    <div class="tabs">

        <button
            type="button"
            id="userTab"
            class="tab active"
            onclick="selectMode('user')">

            👤 User Login

        </button>

        <button
            type="button"
            id="adminTab"
            class="tab"
            onclick="selectMode('admin')">

            👑 Admin Login

        </button>

        <button
            type="button"
            id="signupTab"
            class="tab"
            onclick="selectMode('signup')">

            📝 Sign Up

        </button>

    </div>


    <!-- LOGIN AREA -->

    <div id="loginArea">

        <div class="login-title">

            <span id="loginTitle">
                👤 Normal User Login
            </span>

        </div>


        <form onsubmit="loginUser(event)">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter email"
                    required
                    autocomplete="email">

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter password"
                    required
                    autocomplete="current-password">

            </div>


            <div class="forgot">

                <a onclick="forgotPassword()">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="main-btn"
                id="loginButton">

                Login

            </button>

        </form>

    </div>


    <!-- SIGN UP -->

    <div
        id="signupArea"
        class="hidden">

        <div class="login-title">

            <span>
                📝 Create Normal User Account
            </span>

        </div>


        <form onsubmit="signupUser(event)">

            <div class="form-group">

                <label>Email Address</label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter email"
                    required
                    autocomplete="email">

            </div>


            <div class="form-group">

                <label>Password</label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    minlength="6"
                    required
                    autocomplete="new-password">

            </div>


            <div class="form-group">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="signupConfirm"
                    placeholder="Confirm password"
                    minlength="6"
                    required
                    autocomplete="new-password">

            </div>


            <button
                type="submit"
                class="main-btn"
                id="signupButton">

                Create Account

            </button>

        </form>

    </div>


    <div
        class="message"
        id="message">
    </div>


    <div class="footer">

        🔐 Secure Little Blossoms Management System

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   CURRENT MODE
========================================= */

let loginMode = "user";


/* =========================================
   SELECT MODE
========================================= */

function selectMode(mode){

    loginMode = mode;

    document
        .getElementById("userTab")
        .classList
        .toggle("active", mode === "user");

    document
        .getElementById("adminTab")
        .classList
        .toggle("active", mode === "admin");

    document
        .getElementById("signupTab")
        .classList
        .toggle("active", mode === "signup");


    const loginArea =
        document.getElementById("loginArea");

    const signupArea =
        document.getElementById("signupArea");


    clearMessage();


    if(mode === "signup"){

        loginArea.classList.add("hidden");

        signupArea.classList.remove("hidden");

        return;
    }


    loginArea.classList.remove("hidden");

    signupArea.classList.add("hidden");


    const title =
        document.getElementById("loginTitle");


    if(mode === "admin"){

        title.textContent =
            "👑 Admin Login";

    }
    else{

        title.textContent =
            "👤 Normal User Login";

    }

}


/* =========================================
   MESSAGE
========================================= */

function showMessage(text,type="error"){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.color =
        type === "success"
        ? "#d9ffd9"
        : "#ffe0e0";
}


function clearMessage(){

    document
        .getElementById("message")
        .textContent = "";

}


/* =========================================
   LOGIN
========================================= */

async function loginUser(event){

    event.preventDefault();

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();

    const password =
        document
        .getElementById("loginPassword")
        .value;

    const button =
        document.getElementById("loginButton");


    button.disabled = true;

    button.textContent = "Checking...";

    clearMessage();


    try{

        /* LOGIN */

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({

            email,
            password

        });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "Login failed."
            );

        }


        /* GET ACTUAL ROLE */

        const {
            data: roleData,
            error: roleError
        } =
        await supabaseClient
        .from("user_roles")
        .select("role")
        .eq(
            "user_id",
            data.user.id
        )
        .maybeSingle();


        if(roleError){

            await supabaseClient
                .auth
                .signOut();

            throw new Error(
                "Unable to verify account permission."
            );

        }


        const actualRole =
            roleData?.role || "user";


        /* ADMIN LOGIN */

        if(loginMode === "admin"){

            if(actualRole !== "admin"){

                await supabaseClient
                    .auth
                    .signOut();

                throw new Error(
                    "This account does not have Admin permission."
                );

            }

        }


        /* USER LOGIN */

        if(loginMode === "user"){

            if(actualRole !== "user"){

                await supabaseClient
                    .auth
                    .signOut();

                throw new Error(
                    "This is an Admin account. Please use Admin Login."
                );

            }

        }


        sessionStorage.setItem(
            "lb_role",
            actualRole
        );


        sessionStorage.setItem(
            "lb_user_email",
            data.user.email || ""
        );


        showMessage(
            "Login successful...",
            "success"
        );


        setTimeout(()=>{

            window.location.href =
                "dashboard.html";

        },500);


    }
    catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Login failed."
        );

        button.disabled = false;

        button.textContent = "Login";

    }

}


/* =========================================
   SIGN UP
========================================= */

async function signupUser(event){

    event.preventDefault();


    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("signupPassword")
        .value;


    const confirm =
        document
        .getElementById("signupConfirm")
        .value;


    const button =
        document.getElementById("signupButton");


    clearMessage();


    if(password !== confirm){

        showMessage(
            "Passwords do not match."
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters."
        );

        return;

    }


    button.disabled = true;

    button.textContent = "Creating...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signUp({

            email,
            password

        });


        if(error){

            throw error;

        }


        if(data.session){

            await supabaseClient
                .auth
                .signOut();

        }


        showMessage(
            "Account created. You can login as Normal User.",
            "success"
        );


        document
            .getElementById("signupEmail")
            .value = "";

        document
            .getElementById("signupPassword")
            .value = "";

        document
            .getElementById("signupConfirm")
            .value = "";


        setTimeout(()=>{

            selectMode("user");

        },1200);


    }
    catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Unable to create account."
        );

        button.disabled = false;

        button.textContent =
            "Create Account";

    }

}


/* =========================================
   FORGOT PASSWORD
========================================= */

async function forgotPassword(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    if(!email){

        showMessage(
            "Pehle email enter karo."
        );

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient.auth
        .resetPasswordForEmail(
            email,
            {
                redirectTo:
                    window.location.origin +
                    "/reset-password.html"
            }
        );


        if(error){

            throw error;

        }


        showMessage(
            "Password reset link sent to your email.",
            "success"
        );

    }
    catch(error){

        showMessage(
            error.message ||
            "Unable to send reset link."
        );

    }

}


/* =========================================
   EXISTING SESSION
========================================= */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient
    .auth
    .getSession();


    if(data.session){

        window.location.href =
            "dashboard.html";

    }

}

checkSession();

</script>

</body>
</html>
