<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Little Blossoms</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}


/* =====================================================
   PAGE
===================================================== */

html,
body{

    width:100%;
    height:100%;

    margin:0;
    padding:0;

    overflow:hidden;
}


body{

    position:relative;

    /*
       SAME IMAGE AS BACKGROUND
       This removes the plain upper/lower strips.
    */

    background-image:url("daivik1.png");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;
}


/* =====================================================
   SOFT BACKGROUND BLUR
===================================================== */

body::before{

    content:"";

    position:fixed;

    inset:-20px;

    background-image:url("daivik1.png");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;

    filter:blur(12px);

    transform:scale(1.04);

    opacity:.65;

    z-index:0;
}


/* =====================================================
   MAIN PHOTO
   FULL PHOTO WILL REMAIN VISIBLE
===================================================== */

.background-image{

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100dvh;

    object-fit:contain;

    object-position:center center;

    z-index:1;

    display:block;
}


/* =====================================================
   VERY LIGHT OVERLAY
===================================================== */

.background-overlay{

    position:fixed;

    inset:0;

    background:
        linear-gradient(
            rgba(0,0,0,.025),
            rgba(0,0,0,.025)
        );

    z-index:2;

    pointer-events:none;
}


/* =====================================================
   HOME SCREEN
===================================================== */

.home-screen{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:3;

    pointer-events:none;
}


/* =====================================================
   BRAND NAME
===================================================== */

.brand-name{

    position:fixed;

    left:50%;

    bottom:
        calc(
            91px +
            env(safe-area-inset-bottom)
        );

    transform:translateX(-50%);

    width:90%;

    text-align:center;

    color:white;

    font-size:17px;

    font-weight:600;

    letter-spacing:.7px;

    line-height:1.4;

    text-shadow:
        0 2px 8px rgba(0,0,0,.55);

    z-index:5;

    pointer-events:none;
}


.brand-name span{

    display:block;

    font-size:12px;

    font-weight:400;

    letter-spacing:1.2px;

    margin-top:2px;

    opacity:.95;
}


/* =====================================================
   LOGIN / SIGN UP BUTTON
===================================================== */

.open-login{

    position:fixed;

    left:50%;

    bottom:
        calc(
            28px +
            env(safe-area-inset-bottom)
        );

    transform:translateX(-50%);

    width:205px;

    height:47px;

    padding:0 20px;

    border:1px solid
        rgba(255,255,255,.65);

    border-radius:30px;

    color:white;

    font-size:15px;

    font-weight:600;

    letter-spacing:.2px;

    /*
       SOBER GLASS BUTTON
    */

    background:
        rgba(35,35,45,.45);

    backdrop-filter:blur(10px);

    -webkit-backdrop-filter:blur(10px);

    box-shadow:
        0 7px 20px
        rgba(0,0,0,.28);

    cursor:pointer;

    pointer-events:auto;

    z-index:6;

    transition:.25s;
}


.open-login:hover{

    background:
        rgba(35,35,45,.60);

    transform:
        translateX(-50%)
        translateY(-2px);
}


.open-login:active{

    transform:
        translateX(-50%)
        scale(.97);
}


/* =====================================================
   LOGIN MODAL
===================================================== */

.login-modal{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:20;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.25);

    backdrop-filter:blur(3px);

    -webkit-backdrop-filter:blur(3px);
}


.login-modal.show{

    display:flex;
}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card{

    position:relative;

    width:min(420px,94vw);

    max-height:
        calc(100dvh - 30px);

    overflow-y:auto;

    padding:
        28px 25px 23px;

    border-radius:30px;

    background:
        rgba(255,255,255,.78);

    border:
        1px solid
        rgba(255,255,255,.85);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    animation:
        cardOpen .3s ease;

    scrollbar-width:none;
}


.login-card::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   CARD ANIMATION
===================================================== */

@keyframes cardOpen{

    from{

        opacity:0;

        transform:
            translateY(30px)
            scale(.95);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   CLOSE
===================================================== */

.close-btn{

    position:absolute;

    top:13px;
    right:15px;

    width:36px;
    height:36px;

    border:0;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
        rgba(0,0,0,.07);

    color:#555;

    font-size:23px;

    cursor:pointer;

    z-index:3;
}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:70px;
    height:70px;

    margin:
        3px auto 13px;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    color:white;

    font-size:28px;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff4ca0,
            #b36ce9,
            #43bdf4
        );

    border:
        3px solid
        rgba(255,255,255,.9);

    box-shadow:
        0 8px 25px
        rgba(220,70,170,.35);
}


/* =====================================================
   TITLE
===================================================== */

h1{

    text-align:center;

    color:#222;

    font-size:27px;
}


.subtitle{

    text-align:center;

    color:#666;

    margin:
        6px 0 19px;

    font-size:15px;
}


/* =====================================================
   TABS
===================================================== */

.tabs{

    display:flex;

    gap:6px;

    padding:5px;

    margin-bottom:18px;

    border-radius:14px;

    background:
        rgba(0,0,0,.06);
}


.tab{

    flex:1;

    border:0;

    padding:11px 8px;

    border-radius:10px;

    background:transparent;

    color:#777;

    font-size:15px;

    font-weight:bold;

    cursor:pointer;
}


.tab.active{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff4298,
            #ff7864
        );
}


/* =====================================================
   FORM
===================================================== */

.form-box{
    display:none;
}


.form-box.active{
    display:block;
}


label{

    display:block;

    margin:
        13px 0 7px;

    color:#333;

    font-size:14px;

    font-weight:600;
}


input{

    width:100%;

    min-height:48px;

    padding:
        13px 15px;

    border:
        1px solid
        rgba(100,100,100,.22);

    border-radius:13px;

    outline:none;

    background:
        rgba(255,255,255,.88);

    color:#333;

    font-size:15px;
}


input:focus{

    border-color:#ff70a8;

    box-shadow:
        0 0 0 4px
        rgba(255,100,160,.12);
}


/* =====================================================
   FORGOT
===================================================== */

.forgot{

    display:block;

    text-align:right;

    margin-top:10px;

    color:#e84f91;

    font-size:14px;

    font-weight:600;

    text-decoration:none;
}


/* =====================================================
   ACTION BUTTON
===================================================== */

.action-btn{

    width:100%;

    min-height:50px;

    margin-top:19px;

    padding:13px;

    border:0;

    border-radius:13px;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ff4297,
            #ff7864,
            #ff9b4e
        );

    box-shadow:
        0 9px 25px
        rgba(255,80,130,.28);
}


.action-btn:disabled{

    opacity:.6;

    cursor:not-allowed;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    min-height:20px;

    margin-top:12px;

    text-align:center;

    font-size:13px;

    line-height:1.4;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    margin-top:17px;

    color:#777;

    font-size:11px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:767px){

    .background-image{

        width:100vw;

        height:100dvh;

        object-fit:contain;

        object-position:center center;
    }


    .brand-name{

        bottom:
            calc(
                87px +
                env(safe-area-inset-bottom)
            );

        font-size:16px;
    }


    .brand-name span{

        font-size:11px;
    }


    .open-login{

        bottom:
            calc(
                24px +
                env(safe-area-inset-bottom)
            );

        width:190px;

        height:45px;

        font-size:14px;
    }


    .login-card{

        width:94vw;

        max-height:
            calc(100dvh - 24px);

        padding:
            25px 20px 20px;

        border-radius:27px;
    }


    .logo{

        width:64px;
        height:64px;

        font-size:25px;
    }


    h1{

        font-size:25px;
    }
}


/* =====================================================
   SMALL HEIGHT MOBILE
===================================================== */

@media(
    max-width:480px
) and (
    max-height:700px
){

    .brand-name{

        bottom:
            calc(
                82px +
                env(safe-area-inset-bottom)
            );

        font-size:15px;
    }


    .open-login{

        bottom:
            calc(
                20px +
                env(safe-area-inset-bottom)
            );

        width:180px;

        height:43px;

        font-size:14px;
    }


    .login-card{

        padding:
            20px 19px 18px;
    }


    .logo{

        width:57px;
        height:57px;

        font-size:23px;
    }


    h1{

        font-size:23px;
    }
}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:768px){

    .background-image{

        object-fit:contain;
    }


    .brand-name{

        bottom:105px;

        font-size:20px;
    }


    .brand-name span{

        font-size:13px;
    }


    .open-login{

        bottom:42px;

        width:210px;

        height:48px;

        font-size:15px;
    }
}

</style>

</head>


<body>


<!-- =================================================
     FULL PHOTO
================================================= -->

<img
    src="daivik1.png"
    class="background-image"
    alt="Little Blossoms"
>


<div class="background-overlay"></div>



<!-- =================================================
     HOME
================================================= -->

<div class="home-screen">


    <!-- BRAND -->

    <div class="brand-name">

        Little Blossoms Preschool & Day Care

        <span>
            A place where little minds bloom
        </span>

    </div>


    <!-- LOGIN BUTTON -->

    <button
        type="button"
        class="open-login"
        id="openLogin"
    >
        Login / Sign Up
    </button>

</div>



<!-- =================================================
     LOGIN MODAL
================================================= -->

<div
    class="login-modal"
    id="loginModal"
>


    <div class="login-card">


        <!-- CLOSE -->

        <button
            type="button"
            class="close-btn"
            id="closeLogin"
        >
            ×
        </button>


        <!-- LOGO -->

        <div class="logo">
            LB
        </div>


        <h1>
            Little Blossoms
        </h1>


        <div class="subtitle">
            Management System
        </div>


        <!-- TABS -->

        <div class="tabs">

            <button
                type="button"
                class="tab active"
                id="loginTab"
            >
                Login
            </button>


            <button
                type="button"
                class="tab"
                id="signupTab"
            >
                Sign Up
            </button>

        </div>


        <!-- LOGIN -->

        <div
            class="form-box active"
            id="loginBox"
        >

            <form id="loginForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <a
                    href="reset-password.html"
                    class="forgot"
                >
                    Forgot Password?
                </a>


                <button
                    type="submit"
                    class="action-btn"
                    id="loginBtn"
                >
                    Login
                </button>

            </form>


            <div
                class="message"
                id="loginMessage"
            ></div>

        </div>


        <!-- SIGN UP -->

        <div
            class="form-box"
            id="signupBox"
        >

            <form id="signupForm">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <label>
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="action-btn"
                    id="signupBtn"
                >
                    Create Account
                </button>

            </form>


            <div
                class="message"
                id="signupMessage"
            ></div>

        </div>


        <div class="footer">
            Little Blossoms Preschool & Day Care
        </div>


    </div>

</div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const openLogin =
document.getElementById("openLogin");

const closeLogin =
document.getElementById("closeLogin");

const loginModal =
document.getElementById("loginModal");

const loginTab =
document.getElementById("loginTab");

const signupTab =
document.getElementById("signupTab");

const loginBox =
document.getElementById("loginBox");

const signupBox =
document.getElementById("signupBox");


/* =====================================================
   OPEN
===================================================== */

openLogin.addEventListener(
    "click",
    function(){

        loginModal.classList.add("show");

    }
);


/* =====================================================
   CLOSE
===================================================== */

closeLogin.addEventListener(
    "click",
    function(){

        loginModal.classList.remove("show");

    }
);


/* =====================================================
   OUTSIDE CLICK
===================================================== */

loginModal.addEventListener(
    "click",
    function(e){

        if(e.target === loginModal){

            loginModal.classList.remove("show");

        }

    }
);


/* =====================================================
   LOGIN TAB
===================================================== */

loginTab.addEventListener(
    "click",
    function(){

        loginTab.classList.add("active");

        signupTab.classList.remove("active");

        loginBox.classList.add("active");

        signupBox.classList.remove("active");

    }
);


/* =====================================================
   SIGN UP TAB
===================================================== */

signupTab.addEventListener(
    "click",
    function(){

        signupTab.classList.add("active");

        loginTab.classList.remove("active");

        signupBox.classList.add("active");

        loginBox.classList.remove("active");

    }
);


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("loginPassword")
            .value;


        const button =
            document
            .getElementById("loginBtn");


        const message =
            document
            .getElementById("loginMessage");


        button.disabled = true;

        button.textContent =
            "Logging in...";

        message.textContent = "";


        try{

            const { data, error } =
                await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled = false;

                button.textContent =
                    "Login";

                return;
            }


            message.style.color =
                "#16a34a";

            message.textContent =
                "Login successful...";


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                700
            );

        }
        catch(error){

            console.error(error);

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled = false;

            button.textContent =
                "Login";
        }

    }
);


/* =====================================================
   SIGN UP
===================================================== */

document
.getElementById("signupForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("signupEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("signupPassword")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        const button =
            document
            .getElementById("signupBtn");


        const message =
            document
            .getElementById("signupMessage");


        if(password !== confirmPassword){

            message.style.color =
                "#e53935";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        if(password.length < 6){

            message.style.color =
                "#e53935";

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        button.disabled = true;

        button.textContent =
            "Creating Account...";

        message.textContent = "";


        try{

            const { data, error } =
                await supabaseClient
                .auth
                .signUp({

                    email:email,

                    password:password

                });


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled = false;

                button.textContent =
                    "Create Account";

                return;
            }


            message.style.color =
                "#16a34a";


            if(
                data &&
                data.user &&
                data.user.identities &&
                data.user.identities.length === 0
            ){

                message.textContent =
                    "This email is already registered.";

            }
            else{

                message.textContent =
                    "Account created successfully. Please check your email if confirmation is required.";

            }


            button.disabled = false;

            button.textContent =
                "Create Account";

        }
        catch(error){

            console.error(error);

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled = false;

            button.textContent =
                "Create Account";
        }

    }
);

</script>

</body>
</html>
