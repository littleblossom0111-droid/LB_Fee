<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Blossoms Preschool & Day Care</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
}

/* ================= BACKGROUND ================= */

body{
    background-image:
        linear-gradient(
            rgba(0,0,0,.16),
            rgba(0,0,0,.25)
        ),
        url("daivik1.png");

    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    color:red;
}

/* ================= MAIN HOME ================= */

.home{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    text-align:center;

    padding:25px;

    transition:.35s ease;
}

.home h1{
    font-size:clamp(27px,7vw,48px);
    font-weight:700;

    text-shadow:
        0 3px 15px rgba(0,0,0,.55);

    margin-bottom:10px;
}

.home p{
    font-size:clamp(14px,3.8vw,20px);

    letter-spacing:.5px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.55);

    margin-bottom:35px;
}

/* ================= BUTTONS ================= */

.home-buttons{
    display:flex;
    gap:12px;

    flex-wrap:wrap;
    justify-content:center;
}

.home-btn{
    min-width:125px;

    padding:13px 19px;

    border-radius:30px;

    border:1px solid rgba(255,255,255,.65);

    background:rgba(255,255,255,.12);

    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);

    color:red;

    font-size:14px;
    font-weight:700;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(0,0,0,.18);

    transition:.25s;
}

.home-btn:hover{
    background:rgba(255,255,255,.25);
    transform:translateY(-2px);
}

.home-btn:active{
    transform:scale(.97);
}

/* ================= LOGIN OVERLAY ================= */

.modal{
    position:fixed;

    inset:0;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(0,0,0,.30);

    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);

    opacity:0;
    visibility:hidden;

    transition:.3s ease;

    z-index:10;
}

.modal.show{
    opacity:1;
    visibility:visible;
}

/* ================= GLASS BOX ================= */

.login-box{
    width:100%;
    max-width:390px;

    position:relative;

    padding:28px 23px;

    border-radius:25px;

    background:rgba(255,255,255,.16);

    border:1px solid rgba(255,255,255,.40);

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    box-shadow:
        0 25px 70px rgba(0,0,0,.40);

    transform:translateY(25px) scale(.96);

    transition:.3s ease;
}

.modal.show .login-box{
    transform:translateY(0) scale(1);
}

/* CLOSE */

.close{
    position:absolute;

    right:15px;
    top:12px;

    width:32px;
    height:32px;

    border-radius:50%;

    border:1px solid rgba(255,255,255,.45);

    background:rgba(0,0,0,.18);

    color:red;

    font-size:20px;

    cursor:pointer;
}

/* BOX TITLE */

.box-title{
    text-align:center;

    margin-bottom:22px;
}

.box-title .icon{
    font-size:34px;

    margin-bottom:7px;
}

.box-title h2{
    font-size:22px;

    text-shadow:
        0 2px 8px rgba(0,0,0,.35);
}

.box-title p{
    margin-top:5px;

    font-size:12px;

    opacity:.85;
}

/* FORM */

.form-group{
    margin-bottom:15px;
}

.form-group label{
    display:block;

    margin-bottom:7px;

    font-size:13px;

    font-weight:700;
}

.form-group input{
    width:100%;

    padding:13px 14px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.35);

    outline:none;

    background:rgba(255,255,255,.17);

    color:red;

    font-size:14px;
}

.form-group input::placeholder{
    color:rgba(255,255,255,.75);
}

.form-group input:focus{
    background:rgba(255,255,255,.24);

    border-color:red;
}

/* FORGOT */

.forgot{
    text-align:right;

    margin-top:-3px;

    margin-bottom:17px;
}

.forgot a{
    color:red;

    font-size:12px;
    font-weight:700;

    cursor:pointer;
}

/* LOGIN BUTTON */

.login-submit{
    width:100%;

    padding:14px;

    border:0;

    border-radius:13px;

    color:red;

    font-size:15px;

    font-weight:700;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ec4899,
            #8b5cf6
        );

    box-shadow:
        0 8px 20px rgba(0,0,0,.25);
}

.login-submit:disabled{
    opacity:.6;
}

/* MESSAGE */

.message{
    min-height:18px;

    margin-top:13px;

    text-align:center;

    font-size:12px;

    font-weight:700;
}

/* SIGNUP MODE */

.signup-note{
    text-align:center;

    margin-top:14px;

    font-size:11px;

    opacity:.8;
}

/* MOBILE */

@media(max-width:500px){

    .home{
        padding:20px;
    }

    .home h1{
        max-width:350px;
    }

    .home p{
        margin-bottom:28px;
    }

    .home-buttons{
        width:100%;
        max-width:330px;
    }

    .home-btn{
        width:100%;
    }

    .login-box{
        padding:26px 20px;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     HOME SCREEN
===================================================== -->

<div class="home" id="home">

    <h1>
        Little Blossoms Preschool & Day Care
    </h1>

    <p>
        A place where little minds bloom 🌸
    </p>

    <div class="home-buttons">

        <button
            class="home-btn"
            onclick="openLogin('user')">

            👤 User Login

        </button>

        <button
            class="home-btn"
            onclick="openLogin('admin')">

            👑 Admin Login

        </button>

        <button
            class="home-btn"
            onclick="openLogin('signup')">

            📝 Sign Up

        </button>

    </div>

</div>


<!-- =====================================================
     LOGIN MODAL
===================================================== -->

<div
    class="modal"
    id="loginModal"
    onclick="outsideClose(event)">

    <div class="login-box">

        <button
            class="close"
            onclick="closeLogin()">

            ×

        </button>


        <!-- ================= LOGIN ================= -->

        <div id="loginArea">

            <div class="box-title">

                <div
                    class="icon"
                    id="loginIcon">

                    👤

                </div>

                <h2 id="loginTitle">
                    User Login
                </h2>

                <p>
                    Little Blossoms Preschool & Day Care
                </p>

            </div>


            <form onsubmit="loginUser(event)">

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                        required
                        autocomplete="email">

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password">

                </div>


                <div class="forgot">

                    <a onclick="forgotPassword()">
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-submit"
                    id="loginButton">

                    Login

                </button>

            </form>

        </div>


        <!-- ================= SIGNUP ================= -->

        <div
            id="signupArea"
            style="display:none;">

            <div class="box-title">

                <div class="icon">
                    📝
                </div>

                <h2>
                    Create Account
                </h2>

                <p>
                    New accounts are Normal Users
                </p>

            </div>


            <form onsubmit="signupUser(event)">

                <div class="form-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="signupEmail"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        id="signupPassword"
                        placeholder="Create password"
                        minlength="6"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="signupConfirm"
                        placeholder="Confirm password"
                        minlength="6"
                        required>

                </div>


                <button
                    type="submit"
                    class="login-submit"
                    id="signupButton">

                    Create Account

                </button>

            </form>

            <div class="signup-note">
                🔐 Your account will be created as Normal User
            </div>

        </div>


        <div
            class="message"
            id="message">
        </div>

    </div>

</div>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
    "https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   LOGIN MODE
===================================================== */

let loginMode = "user";


/* =====================================================
   OPEN LOGIN
===================================================== */

function openLogin(mode){

    loginMode = mode;

    const modal =
        document.getElementById("loginModal");

    const loginArea =
        document.getElementById("loginArea");

    const signupArea =
        document.getElementById("signupArea");

    clearMessage();


    if(mode === "signup"){

        loginArea.style.display = "none";

        signupArea.style.display = "block";

    }
    else{

        loginArea.style.display = "block";

        signupArea.style.display = "none";


        const title =
            document.getElementById("loginTitle");

        const icon =
            document.getElementById("loginIcon");


        if(mode === "admin"){

            title.textContent =
                "Admin Login";

            icon.textContent = "👑";

        }
        else{

            title.textContent =
                "User Login";

            icon.textContent = "👤";

        }

    }


    modal.classList.add("show");

    document.body.style.overflow = "hidden";

}


/* =====================================================
   CLOSE LOGIN
===================================================== */

function closeLogin(){

    document
        .getElementById("loginModal")
        .classList
        .remove("show");

    document.body.style.overflow = "";

    clearMessage();

}


/* =====================================================
   OUTSIDE CLICK
===================================================== */

function outsideClose(event){

    if(
        event.target ===
        document.getElementById("loginModal")
    ){

        closeLogin();

    }

}


/* =====================================================
   ESC KEY
===================================================== */

document.addEventListener(
    "keydown",
    function(event){

        if(event.key === "Escape"){

            closeLogin();

        }

    }
);


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
    text,
    type="error"
){

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.color =
        type === "success"
        ? "#d9ffd9"
        : "#ffe0e0";
}


function clearMessage(){

    document
        .getElementById("message")
        .textContent = "";

}


/* =====================================================
   LOGIN
===================================================== */

async function loginUser(event){

    event.preventDefault();


    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("loginPassword")
        .value;


    const button =
        document.getElementById("loginButton");


    button.disabled = true;

    button.textContent = "Checking...";

    clearMessage();


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signInWithPassword({

            email: email,
            password: password

        });


        if(error){

            throw error;

        }


        if(!data.user){

            throw new Error(
                "Login failed."
            );

        }


        /* GET ACTUAL ROLE */

        const {
            data: roleData,
            error: roleError
        } =
        await supabaseClient
        .from("user_roles")
        .select("role")
        .eq(
            "user_id",
            data.user.id
        )
        .maybeSingle();


        if(roleError){

            await supabaseClient.auth.signOut();

            throw new Error(
                "Unable to verify account permission."
            );

        }


        const actualRole =
            roleData?.role || "user";


        /* ADMIN */

        if(loginMode === "admin"){

            if(actualRole !== "admin"){

                await supabaseClient.auth.signOut();

                throw new Error(
                    "This account does not have Admin permission."
                );

            }

        }


        /* USER */

        if(loginMode === "user"){

            if(actualRole !== "user"){

                await supabaseClient.auth.signOut();

                throw new Error(
                    "This is an Admin account. Please use Admin Login."
                );

            }

        }


        /* UI ONLY */

        sessionStorage.setItem(
            "lb_role",
            actualRole
        );

        sessionStorage.setItem(
            "lb_user_email",
            data.user.email || ""
        );


        showMessage(
            "Login successful...",
            "success"
        );


        setTimeout(function(){

            window.location.href =
                "dashboard.html";

        },500);


    }
    catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Login failed."
        );

        button.disabled = false;

        button.textContent = "Login";

    }

}


/* =====================================================
   SIGN UP
===================================================== */

async function signupUser(event){

    event.preventDefault();


    const email =
        document
        .getElementById("signupEmail")
        .value
        .trim();


    const password =
        document
        .getElementById("signupPassword")
        .value;


    const confirm =
        document
        .getElementById("signupConfirm")
        .value;


    const button =
        document.getElementById("signupButton");


    clearMessage();


    if(password !== confirm){

        showMessage(
            "Passwords do not match."
        );

        return;

    }


    if(password.length < 6){

        showMessage(
            "Password must be at least 6 characters."
        );

        return;

    }


    button.disabled = true;

    button.textContent = "Creating...";


    try{

        const {
            data,
            error
        } =
        await supabaseClient.auth
        .signUp({

            email: email,
            password: password

        });


        if(error){

            throw error;

        }


        if(data.session){

            await supabaseClient.auth.signOut();

        }


        showMessage(
            "Account created successfully.",
            "success"
        );


        setTimeout(function(){

            closeLogin();

            document
                .getElementById("signupEmail")
                .value = "";

            document
                .getElementById("signupPassword")
                .value = "";

            document
                .getElementById("signupConfirm")
                .value = "";

        },1200);


    }
    catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Unable to create account."
        );

        button.disabled = false;

        button.textContent =
            "Create Account";

    }

}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

async function forgotPassword(){

    const email =
        document
        .getElementById("loginEmail")
        .value
        .trim();


    if(!email){

        showMessage(
            "Please enter your email first."
        );

        return;

    }


    try{

        const {
            error
        } =
        await supabaseClient.auth
        .resetPasswordForEmail(
            email,
            {
                redirectTo:
                    window.location.origin +
                    "/reset-password.html"
            }
        );


        if(error){

            throw error;

        }


        showMessage(
            "Password reset link sent to your email.",
            "success"
        );

    }
    catch(error){

        showMessage(
            error.message ||
            "Unable to send reset link."
        );

    }

}


/* =====================================================
   SESSION CHECK
===================================================== */

async function checkSession(){

    const {
        data
    } =
    await supabaseClient.auth.getSession();


    if(data.session){

        window.location.href =
            "dashboard.html";

    }

}

checkSession();

</script>

</body>
</html>
