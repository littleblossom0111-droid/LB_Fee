<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Little Blossoms</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =====================================================
   RESET
===================================================== */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}


/* =====================================================
   BACKGROUND
===================================================== */

body{
    position:relative;
    background:#000;
}


/* =====================================================
   FULL SCREEN BABY PHOTO
===================================================== */

.background-image{

    position:fixed;

    top:0;
    left:0;

    width:100vw;
    height:100dvh;

    /*
       Full screen.
       No duplicate strip.
    */

    object-fit:cover;

    object-position:center center;

    display:block;

    z-index:1;
}


/* =====================================================
   SOFT OVERLAY
===================================================== */

.background-overlay{

    position:fixed;

    inset:0;

    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.04) 0%,
            rgba(0,0,0,0) 45%,
            rgba(0,0,0,.12) 70%,
            rgba(0,0,0,.38) 100%
        );

    z-index:2;

    pointer-events:none;
}


/* =====================================================
   HOME SCREEN
===================================================== */

.home-screen{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:3;

    pointer-events:none;
}


/* =====================================================
   CENTER BRAND
===================================================== */

.brand-area{

    position:absolute;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    width:92%;

    text-align:center;

    color:white;

    /*
       Small shadow so text stays readable
       over the baby photo.
    */

    text-shadow:
        0 2px 10px rgba(0,0,0,.65);

    pointer-events:none;
}


/* =====================================================
   LITTLE BLOSSOMS
===================================================== */

.brand-title{

    font-size:26px;

    font-weight:600;

    letter-spacing:.6px;

    line-height:1.25;

    white-space:nowrap;
}


/* =====================================================
   SUBTITLE
===================================================== */

.brand-subtitle{

    margin-top:9px;

    font-size:14px;

    font-weight:400;

    letter-spacing:1.2px;

    opacity:.97;
}


/* =====================================================
   LOGIN BUTTON
===================================================== */

.open-login{

    position:absolute;

    left:50%;

    top:calc(50% + 82px);

    transform:translateX(-50%);

    width:180px;

    height:45px;

    border:

        1px solid
        rgba(255,255,255,.7);

    border-radius:30px;

    color:white;

    font-size:14px;

    font-weight:600;

    letter-spacing:.3px;

    background:
        rgba(30,30,35,.48);

    backdrop-filter:blur(12px);

    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.30);

    cursor:pointer;

    pointer-events:auto;

    transition:.25s;
}


.open-login:hover{

    background:
        rgba(30,30,35,.62);

    transform:
        translateX(-50%)
        translateY(-2px);
}


.open-login:active{

    transform:
        translateX(-50%)
        scale(.97);
}


/* =====================================================
   LOGIN MODAL
===================================================== */

.login-modal{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:20;

    display:none;

    align-items:center;

    justify-content:center;

    padding:15px;

    background:
        rgba(0,0,0,.28);

    backdrop-filter:blur(4px);

    -webkit-backdrop-filter:blur(4px);
}


.login-modal.show{

    display:flex;
}


/* =====================================================
   LOGIN CARD
===================================================== */

.login-card{

    position:relative;

    width:min(420px,94vw);

    max-height:
        calc(100dvh - 30px);

    overflow-y:auto;

    padding:
        28px 25px 23px;

    border-radius:28px;

    background:
        rgba(255,255,255,.88);

    border:
        1px solid
        rgba(255,255,255,.9);

    backdrop-filter:blur(18px);

    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.35);

    animation:
        cardOpen .3s ease;

    scrollbar-width:none;
}


.login-card::-webkit-scrollbar{
    display:none;
}


/* =====================================================
   CARD ANIMATION
===================================================== */

@keyframes cardOpen{

    from{

        opacity:0;

        transform:
            translateY(25px)
            scale(.96);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

.close-btn{

    position:absolute;

    top:12px;
    right:14px;

    width:35px;
    height:35px;

    border:0;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        rgba(0,0,0,.07);

    color:#555;

    font-size:23px;

    cursor:pointer;
}


/* =====================================================
   LOGO
===================================================== */

.logo{

    width:68px;
    height:68px;

    margin:
        3px auto 13px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    color:white;

    font-size:27px;

    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #ff4ca0,
            #ad69e9,
            #42bdf3
        );

    border:
        3px solid
        rgba(255,255,255,.9);

    box-shadow:
        0 8px 25px
        rgba(220,70,170,.35);
}


/* =====================================================
   CARD TITLE
===================================================== */

.login-card h1{

    text-align:center;

    color:#222;

    font-size:26px;
}


.subtitle{

    text-align:center;

    color:#666;

    margin:
        6px 0 18px;

    font-size:15px;
}


/* =====================================================
   LOGIN / SIGNUP TABS
===================================================== */

.tabs{

    display:flex;

    gap:6px;

    padding:5px;

    margin-bottom:18px;

    border-radius:14px;

    background:
        rgba(0,0,0,.06);
}


.tab{

    flex:1;

    border:0;

    padding:10px 8px;

    border-radius:10px;

    background:transparent;

    color:#777;

    font-size:14px;

    font-weight:bold;

    cursor:pointer;
}


.tab.active{

    color:white;

    background:
        linear-gradient(
            135deg,
            #ff4298,
            #ff7864
        );
}


/* =====================================================
   FORM
===================================================== */

.form-box{
    display:none;
}


.form-box.active{
    display:block;
}


label{

    display:block;

    margin:
        13px 0 7px;

    color:#333;

    font-size:14px;

    font-weight:600;
}


input{

    width:100%;

    min-height:48px;

    padding:
        13px 15px;

    border:
        1px solid
        rgba(100,100,100,.22);

    border-radius:13px;

    outline:none;

    background:
        rgba(255,255,255,.92);

    color:#333;

    font-size:15px;
}


input:focus{

    border-color:#ff70a8;

    box-shadow:
        0 0 0 4px
        rgba(255,100,160,.12);
}


/* =====================================================
   FORGOT PASSWORD
===================================================== */

.forgot{

    display:block;

    text-align:right;

    margin-top:10px;

    color:#e84f91;

    font-size:14px;

    font-weight:600;

    text-decoration:none;
}


/* =====================================================
   ACTION BUTTON
===================================================== */

.action-btn{

    width:100%;

    min-height:49px;

    margin-top:19px;

    padding:13px;

    border:0;

    border-radius:13px;

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    background:
        linear-gradient(
            135deg,
            #ff4297,
            #ff7864,
            #ff9b4e
        );

    box-shadow:
        0 9px 25px
        rgba(255,80,130,.28);
}


.action-btn:disabled{

    opacity:.6;

    cursor:not-allowed;
}


/* =====================================================
   MESSAGE
===================================================== */

.message{

    min-height:20px;

    margin-top:12px;

    text-align:center;

    font-size:13px;

    line-height:1.4;
}


/* =====================================================
   FOOTER
===================================================== */

.footer{

    text-align:center;

    margin-top:17px;

    color:#777;

    font-size:11px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:767px){

    .background-image{

        width:100vw;

        height:100dvh;

        object-fit:cover;

        object-position:center center;
    }


    /* CENTER TEXT */

    .brand-area{

        top:50%;

        width:94%;
    }


    .brand-title{

        font-size:21px;

        letter-spacing:.3px;
    }


    .brand-subtitle{

        margin-top:8px;

        font-size:12px;

        letter-spacing:.8px;
    }


    /* BUTTON */

    .open-login{

        top:calc(50% + 72px);

        width:175px;

        height:44px;

        font-size:14px;
    }


    /* LOGIN CARD */

    .login-card{

        width:94vw;

        max-height:
            calc(100dvh - 24px);

        padding:
            25px 20px 20px;

        border-radius:27px;
    }


    .logo{

        width:63px;
        height:63px;

        font-size:25px;
    }


    .login-card h1{

        font-size:24px;
    }
}


/* =====================================================
   VERY SMALL MOBILE
===================================================== */

@media(
    max-width:380px
){

    .brand-title{

        font-size:18px;
    }


    .brand-subtitle{

        font-size:11px;
    }


    .open-login{

        top:calc(50% + 67px);

        width:165px;

        height:42px;

        font-size:13px;
    }
}


/* =====================================================
   DESKTOP
===================================================== */

@media(min-width:768px){

    .brand-title{

        font-size:29px;
    }


    .brand-subtitle{

        font-size:14px;
    }


    .open-login{

        top:calc(50% + 90px);

        width:190px;

        height:46px;
    }
}

</style>

</head>


<body>


<!-- =====================================================
     FULL PHOTO
===================================================== -->

<img
    src="daivik1.png"
    class="background-image"
    alt="Little Blossoms"
>


<div class="background-overlay"></div>



<!-- =====================================================
     HOME SCREEN
===================================================== -->

<div class="home-screen">


    <!-- CENTER BRAND -->

    <div class="brand-area">

        <div class="brand-title">

            Little Blossoms Preschool & Day Care

        </div>


        <div class="brand-subtitle">

            A place where little minds bloom

        </div>

    </div>



    <!-- LOGIN BUTTON -->

    <button
        type="button"
        class="open-login"
        id="openLogin"
    >

        Login / Sign Up

    </button>

</div>



<!-- =====================================================
     LOGIN MODAL
===================================================== -->

<div
    class="login-modal"
    id="loginModal"
>


    <div class="login-card">


        <!-- CLOSE -->

        <button
            type="button"
            class="close-btn"
            id="closeLogin"
        >
            ×
        </button>


        <!-- LOGO -->

        <div class="logo">
            LB
        </div>


        <h1>
            Little Blossoms
        </h1>


        <div class="subtitle">
            Management System
        </div>


        <!-- TABS -->

        <div class="tabs">

            <button
                type="button"
                class="tab active"
                id="loginTab"
            >
                Login
            </button>


            <button
                type="button"
                class="tab"
                id="signupTab"
            >
                Sign Up
            </button>

        </div>



        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <div
            class="form-box active"
            id="loginBox"
        >

            <form id="loginForm">


                <label>
                    Email
                </label>


                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label>
                    Password
                </label>


                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >


                <a
                    href="reset-password.html"
                    class="forgot"
                >
                    Forgot Password?
                </a>


                <button
                    type="submit"
                    class="action-btn"
                    id="loginBtn"
                >
                    Login
                </button>


            </form>


            <div
                class="message"
                id="loginMessage"
            ></div>

        </div>



        <!-- =================================================
             SIGN UP FORM
        ================================================== -->

        <div
            class="form-box"
            id="signupBox"
        >

            <form id="signupForm">


                <label>
                    Email
                </label>


                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >


                <label>
                    Password
                </label>


                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <label>
                    Confirm Password
                </label>


                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >


                <button
                    type="submit"
                    class="action-btn"
                    id="signupBtn"
                >
                    Create Account
                </button>


            </form>


            <div
                class="message"
                id="signupMessage"
            ></div>

        </div>



        <div class="footer">

            Little Blossoms Preschool & Day Care

        </div>


    </div>

</div>



<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";


const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const openLogin =
document.getElementById("openLogin");

const closeLogin =
document.getElementById("closeLogin");

const loginModal =
document.getElementById("loginModal");

const loginTab =
document.getElementById("loginTab");

const signupTab =
document.getElementById("signupTab");

const loginBox =
document.getElementById("loginBox");

const signupBox =
document.getElementById("signupBox");


/* =====================================================
   OPEN LOGIN
===================================================== */

openLogin.addEventListener(
    "click",
    function(){

        loginModal.classList.add("show");

    }
);


/* =====================================================
   CLOSE LOGIN
===================================================== */

closeLogin.addEventListener(
    "click",
    function(){

        loginModal.classList.remove("show");

    }
);


/* =====================================================
   OUTSIDE CLICK
===================================================== */

loginModal.addEventListener(
    "click",
    function(e){

        if(e.target === loginModal){

            loginModal.classList.remove("show");

        }

    }
);


/* =====================================================
   LOGIN TAB
===================================================== */

loginTab.addEventListener(
    "click",
    function(){

        loginTab.classList.add("active");

        signupTab.classList.remove("active");

        loginBox.classList.add("active");

        signupBox.classList.remove("active");

    }
);


/* =====================================================
   SIGN UP TAB
===================================================== */

signupTab.addEventListener(
    "click",
    function(){

        signupTab.classList.add("active");

        loginTab.classList.remove("active");

        signupBox.classList.add("active");

        loginBox.classList.remove("active");

    }
);


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("loginEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("loginPassword")
            .value;


        const button =
            document
            .getElementById("loginBtn");


        const message =
            document
            .getElementById("loginMessage");


        button.disabled = true;

        button.textContent =
            "Logging in...";

        message.textContent = "";


        try{

            const { data, error } =
                await supabaseClient
                .auth
                .signInWithPassword({

                    email:email,

                    password:password

                });


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled = false;

                button.textContent =
                    "Login";

                return;
            }


            message.style.color =
                "#16a34a";

            message.textContent =
                "Login successful...";


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                700
            );

        }
        catch(error){

            console.error(error);

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled = false;

            button.textContent =
                "Login";
        }

    }
);


/* =====================================================
   SIGN UP
===================================================== */

document
.getElementById("signupForm")
.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();


        const email =
            document
            .getElementById("signupEmail")
            .value
            .trim();


        const password =
            document
            .getElementById("signupPassword")
            .value;


        const confirmPassword =
            document
            .getElementById("confirmPassword")
            .value;


        const button =
            document
            .getElementById("signupBtn");


        const message =
            document
            .getElementById("signupMessage");


        /* PASSWORD CHECK */

        if(password !== confirmPassword){

            message.style.color =
                "#e53935";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        if(password.length < 6){

            message.style.color =
                "#e53935";

            message.textContent =
                "Password must be at least 6 characters.";

            return;
        }


        button.disabled = true;

        button.textContent =
            "Creating Account...";

        message.textContent = "";


        try{

            const { data, error } =
                await supabaseClient
                .auth
                .signUp({

                    email:email,

                    password:password

                });


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled = false;

                button.textContent =
                    "Create Account";

                return;
            }


            message.style.color =
                "#16a34a";


            if(
                data &&
                data.user &&
                data.user.identities &&
                data.user.identities.length === 0
            ){

                message.textContent =
                    "This email is already registered.";

            }
            else{

                message.textContent =
                    "Account created successfully. Please check your email if confirmation is required.";

            }


            button.disabled = false;

            button.textContent =
                "Create Account";

        }
        catch(error){

            console.error(error);

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled = false;

            button.textContent =
                "Create Account";
        }

    }
);

</script>

</body>
</html>
