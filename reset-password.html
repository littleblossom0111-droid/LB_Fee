<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Little Blossoms - Reset Password</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:
        linear-gradient(
            135deg,
            #fff4f8,
            #eef7ff
        );
}

.reset-box{
    width:92%;
    max-width:400px;
    background:white;
    padding:35px 28px;
    border-radius:24px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.12);
}

.logo{
    width:75px;
    height:75px;
    margin:0 auto 15px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        linear-gradient(
            135deg,
            #ff7eb3,
            #65c7f7
        );

    color:white;

    font-size:30px;
    font-weight:bold;
}

h1{
    text-align:center;
    color:#333;
    font-size:25px;
}

.subtitle{
    text-align:center;
    color:#888;
    margin:8px 0 25px;
    line-height:1.5;
}

label{
    display:block;
    margin:15px 0 7px;
    color:#444;
    font-weight:600;
}

input{
    width:100%;
    padding:14px;

    border:1px solid #ddd;
    border-radius:12px;

    outline:none;

    font-size:15px;

    transition:.2s;
}

input:focus{
    border-color:#ff72a7;

    box-shadow:
        0 0 0 3px
        rgba(255,114,167,.12);
}

button{
    width:100%;

    margin-top:24px;

    padding:14px;

    border:0;
    border-radius:12px;

    background:
        linear-gradient(
            135deg,
            #ff72a7,
            #ff9a62
        );

    color:white;

    font-size:16px;
    font-weight:bold;

    cursor:pointer;
}

button:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.back-login{
    display:block;

    text-align:center;

    margin-top:18px;

    color:#e85d93;

    font-size:14px;
    font-weight:600;

    text-decoration:none;
}

.back-login:hover{
    text-decoration:underline;
}

#message{
    margin-top:15px;

    text-align:center;

    font-size:14px;

    line-height:1.5;
}

.success-box{
    display:none;

    margin-top:20px;

    padding:15px;

    border-radius:12px;

    background:#ecfdf5;

    color:#15803d;

    text-align:center;

    font-size:14px;

    line-height:1.5;
}

.footer{
    text-align:center;

    margin-top:25px;

    color:#aaa;

    font-size:12px;
}

</style>

</head>

<body>

<div class="reset-box">

    <div class="logo">
        LB
    </div>

    <h1>
        Reset Password
    </h1>

    <div class="subtitle">
        Enter your registered email and
        we'll send you a password reset link.
    </div>


    <form id="resetForm">

        <label>
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your registered email"
            autocomplete="email"
            required
        >

        <button
            type="submit"
            id="sendBtn"
        >
            Send Reset Link
        </button>

    </form>


    <div id="message"></div>


    <div
        id="successBox"
        class="success-box"
    >
        Reset link sent successfully.

        <br><br>

        Please check your email inbox
        and open the reset link.
    </div>


    <a
        href="login.html"
        class="back-login"
    >
        ← Back to Login
    </a>


    <div class="footer">
        Little Blossoms Preschool & Day Care
    </div>

</div>


<script>

const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const form =
document.getElementById("resetForm");

const button =
document.getElementById("sendBtn");

const message =
document.getElementById("message");

const successBox =
document.getElementById("successBox");


form.addEventListener(
    "submit",
    async function(e){

        e.preventDefault();

        const email =
            document
            .getElementById("email")
            .value
            .trim();

        if(!email){
            return;
        }


        button.disabled = true;

        button.textContent =
            "Sending...";

        message.textContent = "";

        successBox.style.display =
            "none";


        try{

            /*
             * IMPORTANT:
             * This URL must match the URL
             * configured in Supabase.
             */

            const redirectUrl =
                window.location.origin +
                window.location.pathname
                    .replace(
                        "reset-password.html",
                        "update-password.html"
                    );


            const { error } =
                await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                            redirectUrl
                    }
                );


            if(error){

                message.style.color =
                    "#e53935";

                message.textContent =
                    error.message;

                button.disabled =
                    false;

                button.textContent =
                    "Send Reset Link";

                return;
            }


            message.style.color =
                "#16a34a";

            message.textContent =
                "Reset link has been sent to your email.";

            successBox.style.display =
                "block";

            button.textContent =
                "Email Sent";

        }catch(err){

            message.style.color =
                "#e53935";

            message.textContent =
                "Something went wrong. Please try again.";

            button.disabled =
                false;

            button.textContent =
                "Send Reset Link";
        }

    }
);

</script>

</body>
</html>
