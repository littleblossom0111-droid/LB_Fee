<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Reset Password - Little Blossoms</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(circle at top left,#dbeafe,transparent 35%),
        radial-gradient(circle at bottom right,#fce7f3,transparent 35%),
        linear-gradient(135deg,#f8fafc,#eef2ff);
}

.box{
    width:100%;
    max-width:430px;
    background:rgba(255,255,255,.94);
    border:1px solid rgba(255,255,255,.8);
    border-radius:28px;
    padding:38px 30px;
    box-shadow:0 25px 70px rgba(15,23,42,.15);
    text-align:center;
}

.logo{
    width:70px;
    height:70px;
    margin:0 auto 18px;
    border-radius:22px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
    color:white;
    background:linear-gradient(135deg,#6366f1,#8b5cf6);
    box-shadow:0 12px 30px rgba(99,102,241,.35);
}

h1{
    color:#111827;
    font-size:28px;
    margin-bottom:8px;
}

.subtitle{
    color:#64748b;
    font-size:14px;
    margin-bottom:28px;
}

label{
    display:block;
    text-align:left;
    font-size:13px;
    font-weight:700;
    color:#334155;
    margin:0 0 8px;
}

input{
    width:100%;
    padding:14px 15px;
    border:1px solid #dbe2ea;
    border-radius:14px;
    outline:none;
    font-size:15px;
    margin-bottom:18px;
    transition:.2s;
    background:#f8fafc;
}

input:focus{
    border-color:#6366f1;
    background:#fff;
    box-shadow:0 0 0 4px rgba(99,102,241,.10);
}

button{
    width:100%;
    border:0;
    border-radius:14px;
    padding:14px;
    font-size:15px;
    font-weight:800;
    color:white;
    cursor:pointer;
    background:linear-gradient(135deg,#4f46e5,#7c3aed);
    box-shadow:0 10px 25px rgba(79,70,229,.25);
    transition:.2s;
}

button:hover{
    transform:translateY(-1px);
}

button:disabled{
    opacity:.65;
    cursor:not-allowed;
    transform:none;
}

.message{
    margin-top:18px;
    padding:12px;
    border-radius:12px;
    font-size:13px;
    display:none;
}

.success{
    display:block;
    background:#ecfdf5;
    color:#047857;
}

.error{
    display:block;
    background:#fef2f2;
    color:#b91c1c;
}

.back{
    display:block;
    margin-top:20px;
    color:#4f46e5;
    text-decoration:none;
    font-size:13px;
    font-weight:700;
}

.footer{
    margin-top:28px;
    font-size:12px;
    color:#94a3b8;
}
</style>
</head>

<body>

<div class="box">

    <div class="logo">LB</div>

    <h1>Reset Password</h1>

    <div class="subtitle">
        Enter your registered email address and we'll send you a secure password reset link.
    </div>

    <form id="resetForm">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit" id="resetBtn">
            Send Reset Link
        </button>

    </form>

    <div id="message" class="message"></div>

    <a href="login.html" class="back">
        ← Back to Login
    </a>

    <div class="footer">
        Little Blossoms Preschool & Day Care
    </div>

</div>

<script>

const SUPABASE_URL =
"https://holelzxzhaiefaqezmce.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KoCQClKL582rggMuDJXhYQ_UhHOB4xZ";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* IMPORTANT:
   Always send password recovery to GitHub Pages,
   NEVER localhost.
*/

const REDIRECT_URL =
"https://littleblossom0111-droid.github.io/LB_Fee/update-password.html";


const form = document.getElementById("resetForm");
const emailInput = document.getElementById("email");
const resetBtn = document.getElementById("resetBtn");
const message = document.getElementById("message");


function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;

}


form.addEventListener("submit", async function(e){

    e.preventDefault();

    const email =
        emailInput.value.trim();

    if(!email){
        showMessage(
            "Please enter your email address.",
            "error"
        );
        return;
    }


    resetBtn.disabled = true;

    resetBtn.textContent =
        "Sending...";

    message.className =
        "message";

    try{

        const { error } =
        await supabaseClient.auth.resetPasswordForEmail(
            email,
            {
                redirectTo: REDIRECT_URL
            }
        );


        if(error){
            throw error;
        }


        showMessage(
            "Password reset link sent! Please check your email.",
            "success"
        );

        resetBtn.textContent =
            "Reset Link Sent";


    }catch(error){

        console.error(error);

        showMessage(
            error.message ||
            "Unable to send reset link.",
            "error"
        );

        resetBtn.disabled = false;

        resetBtn.textContent =
            "Send Reset Link";
    }

});

</script>

</body>
</html>
